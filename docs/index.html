function Onboarding({ settings, onSubmit, onCode }) {
  const toast = useToast();
  const au = window.IS_SITE && window.SITE.auth ? window.SITE.auth.currentUser : null;
  const pendingCode = (() => { try { return normCode(localStorage.getItem("pending_code") || ""); } catch (e) { return ""; } })();
  const [step, setStep] = useState(0);
  const [f, setF] = useState({ name: (au && au.displayName) || "", email: (au && au.email) || "", phone: "", birthYear: "", sport: "", answers: { compet: null, xp: null, freq: 3 },
    programId: "", niveau: "", screening: SCREENING.map(() => null), prereq: [], side: "", consent: false, parentName: "", parentEmail: "", parentOk: false });
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF((o) => ({ ...o, [k]: v }));
  const setA = (k, v) => setF((o) => ({ ...o, answers: { ...o.answers, [k]: v } }));
  const prog = PB[f.programId];

  const rec = recommendNiveau(f.answers, age, flag);
  const niveau = f.niveau || rec.id;
  const cat = sportCat(f.sport);
  const recProgs = PROG_FOR_SPORT[cat] || [];

    if (step === 3) return !!f.programId;
    if (step === 4) return f.screening.every((x) => x !== null) && prereqOk && (!minor || (f.parentName.trim().length > 1 && mailOk(f.parentEmail)));
    if (step === 5) return f.consent && (!minor || f.parentOk);

    setBusy(true);

      screening: f.screening, screeningFlag: flag, consent: { at: nowISO(), text: consentTxt, v: window.IS_SITE ? "site2" : 3 },
      parent: minor ? { name: f.parentName.trim(), email: f.parentEmail.trim(), at: nowISO(), ok: true } : null, createdAt: nowISO() };
    try { await onSubmit(profile); } catch (e) { toast("Inscription impossible : " + (e.message || "réessaie."), "bad"); } finally { setBusy(false); }

      <div className="row2"><${Field} label="Année de naissance" id="ob-by"><input id="ob-by" inputMode="numeric" value=${f.birthYear} onChange=${(e) => set("birthYear", e.target.value.replace(/\D/g, "").slice(0, 4))} /></${Field}>
        <${Field} label="Sport pratiqué" id="ob-sport" hint=${f.sport ? "Reconnu : " + SPORT_LABEL[cat] : null}><input id="ob-sport" value=${f.sport} onChange=${(e) => set("sport", e.target.value)} placeholder="Rugby, course, aucun…" /></${Field}></div>
    </div>` : null}
    ${step === 2 ? html`<div className="stack form"><h2>Ton niveau</h2>
      <p className="muted small">Ces réponses règlent la précision de tes séances : charges, tempo, récupération, prévention.</p>
      <${Field} label=${NIVQ.compet ? NIVQ.compet.n : "Niveau"}><${Seg} id="nq-compet" options=${opts("compet")} value=${f.answers.compet} onChange=${(v) => setA("compet", v)} /></${Field}>
      <${Field} label=${NIVQ.xp ? NIVQ.xp.n : "Expérience"}><${Seg} id="nq-xp" options=${opts("xp")} value=${f.answers.xp} onChange=${(v) => setA("xp", v)} /></${Field}>
      <${Field} label=${NIVQ.freq ? NIVQ.freq.n : "Séances"}><${Seg} id="nq-freq" options=${opts("freq")} value=${f.answers.freq} onChange=${(v) => setA("freq", v)} /></${Field}>
      ${f.answers.compet !== null && f.answers.xp !== null ? html`<div className="field"><span className="field-l">Ton profil</span><${NiveauCards} value=${niveau} onChange=${(v) => set("niveau", v)} recommended=${rec.id} />
        <span className="field-h">${rec.why.join(" ")}${f.niveau && nivRank(f.niveau) > nivRank(rec.id) ? " Tu as choisi un profil plus exigeant que conseillé : ton coach le vérifiera." : ""}</span></div>` : null}
    </div>` : null}
    ${step === 3 ? html`<div className="stack"><h2>Ton objectif</h2>
      ${recProgs.length && cat !== "aucun" ? html`<p className="muted small">Conseillés pour un ${SPORT_LABEL[cat]} : ${recProgs.slice(0, 2).map((x) => PB[x].n).join(", ")}.</p>` : null}
      <div className="pgrid">${PROGS.map((x) => html`<button key=${x.id} type="button" className=${"pcard" + (f.programId === x.id ? " on" : "")} aria-pressed=${f.programId === x.id} onClick=${() => set("programId", x.id)}>

      ${prog ? html`<${Card} title=${prog.n}><p className="small">${prog.desc}</p><${FitChecks} checks=${checks} /></${Card}>` : null}</div>` : null}
    ${step === 4 ? html`<div className="stack form"><h2>Ta santé</h2>

      ${flag ? html`<div className="alert warn"><div><b>Avis médical recommandé</b><p>Consulte ton médecin avant de commencer et montre-lui ton programme. En attendant, tes séances restent en mode Reprise et ton coach en est informé.</p></div></div>` : null}
      ${prog && prog.prereq ? html`<${Card} title="Critères de reprise de la course" sub="Coche chaque critère rempli.">
        ${prog.prereq.map((c, i) => html`<label key=${i} className="chk"><input type="checkbox" id=${"pr-" + i} checked=${f.prereq.includes(i)} onChange=${(e) => set("prereq", e.target.checked ? [...f.prereq, i] : f.prereq.filter((x) => x !== i))} /><span>${c}</span></label>`)}

      ${minor ? html`<label className="chk"><input id="ob-parent" type="checkbox" checked=${f.parentOk} onChange=${(e) => set("parentOk", e.target.checked)} /><span>Je suis ${f.parentName || "le parent ou tuteur légal"} et j'autorise l'inscription de ${f.name || "mon enfant"} ainsi que le traitement de ses données d'entraînement et de santé pour son suivi.</span></label>` : null}
    </div>` : null}
    ${step > 0 ? html`<div className="navbtns">

      ${step < 5 ? html`<${Btn} onClick=${() => setStep(step + 1)} disabled=${!can()}>Continuer</${Btn}>` : html`<${Btn} onClick=${submit} disabled=${!can() || busy}>"Continuer vers mon accès"</${Btn}>`}
    </div>` : null}
  </div>`;

/* ===== Espace coach ===== */
const COACH_NAV = [
  { id: "dash", n: "Tableau de bord" }, { id: "clients", n: "Clients" }, { id: "programmes", n: "Programmes" },
  { id: "exos", n: "Exercices" }, { id: "codes", n: "Codes & essais" }, { id: "reglages", n: "Offres & réglages" },
];

function rowInfo(row, lib, today, settings) {
  const p = row.profile || {}, plan = row.plan, sum = p.sum || {};
  const req = p.request || {};
  const pid = plan ? plan.programId : req.programId;
  const prog = progOf(pid, lib);
  const ps = plan && plan.status !== "pending" ? planState(plan, today) : null;
  const alerts = [];
  let status = { tone: "muted", n: "—" };
  if (!plan || plan.status === "pending") { status = { tone: "gold", n: p.access && p.access.lastOrder ? "Commande en cours" : "Sans accès" }; if ((req.programId || p.manual) && !(p.access && p.access.lastOrder) && !window.IS_SITE) alerts.push({ tone: "gold", n: "Nouvelle demande à valider", k: "plan" }); }
  else if (plan.status === "archived") status = { tone: "muted", n: "Archivé" };
  else if (ps && ps.phase === "avant") status = { tone: "muted", n: "Démarre le " + fmtD(plan.start) };
  else if (ps && ps.phase === "en_cours") status = { tone: "ok", n: "Semaine " + ps.week + "/" + ps.weeks };
  else if (ps && ps.phase === "fini") status = { tone: "muted", n: "Terminé" };
  if (p.screeningFlag && (!plan || plan.medicalHold !== false)) alerts.push({ tone: "warn", n: plan && plan.medicalHold ? "Avis médical à recevoir (séances en Reprise)" : "Questionnaire santé : avis médical", k: "plan" });
  const lo = p.access && p.access.lastOrder;
  const recentAuto = lo && lo.kind === "paiement" && payMode(settings) === "auto" && Date.now() - new Date(lo.at).getTime() < 15 * 60 * 1000;
  if (lo && lo.status === "en_attente" && !recentAuto && !(plan && plan.source && plan.source.orderId === lo.id)) alerts.push({ tone: "gold", n: lo.kind === "code" ? "Code " + (lo.code || "") + " à activer" : lo.kind === "paiement" ? "Paiement Stripe à vérifier · " + eur(lo.price || 0) : "Commande à encaisser · " + eur(lo.price || 0), k: "plan" });
  if (lo && lo.withdrawal && !lo.withdrawal.refundedAt) alerts.push({ tone: "bad", n: "Rétractation : rembourser " + eur2(lo.withdrawal.refund || 0), k: "plan" });
  if (plan && plan.source && ["code", "paiement"].includes(plan.source.kind) && !plan.reviewedAt && plan.status === "active") alerts.push({ tone: "gold", n: "Nouvel accès (" + (plan.source.kind === "code" ? "code" : "paiement") + ") : vérifier le plan", k: "plan" });
  if ((sum.lastPain || 0) >= 4) alerts.push({ tone: "bad", n: "Douleur " + sum.lastPain + "/10", k: "seances" });
  if (sum.aiAlert) alerts.push({ tone: "bad", n: "Alerte du coach IA", k: "ia" });
  if ((sum.aiPending || 0) > 0 && !sum.aiAlert) alerts.push({ tone: "gold", n: plural(sum.aiPending, "ajustement IA", "ajustements IA") + " à vérifier", k: "ia" });
  else if ((sum.aiPending || 0) > 1 && sum.aiAlert) alerts.push({ tone: "gold", n: plural(sum.aiPending - 1, "autre point IA", "autres points IA") + " à vérifier", k: "ia" });
  let adherence = null, weekDone = 0, weekPlanned = 0;
  if (ps && prog && plan.status !== "archived") {
    if (ps.phase === "en_cours") {
      const sinceStart = diffDays(plan.start, today);
      const last = sum.lastLogAt ? diffDays(sum.lastLogAt, today) : sinceStart;
      if (last >= 7) alerts.push({ tone: "warn", n: "Aucune séance depuis " + last + " j", k: "seances" });
      const left = diffDays(today, ps.end);
      if (left <= 7) alerts.push({ tone: "gold", n: "Fin dans " + Math.max(0, left) + " j : proposer la suite", k: "plan" });
      weekPlanned = plannedCount(prog, plan, ps.week, lib);
      weekDone = (sum.weeksDone && sum.weeksDone[ps.week]) || 0;
      if (ps.week > 1) {
        let pl = 0, dn = 0;
        for (let w = 1; w < ps.week; w++) { const n = plannedCount(prog, plan, w, lib); pl += n; dn += Math.min(n, (sum.weeksDone && sum.weeksDone[w]) || 0); }
        adherence = pl ? dn / pl : null;
        if (adherence !== null && adherence < 0.6) alerts.push({ tone: "warn", n: "Régularité faible (" + Math.round(adherence * 100) + " %)", k: "vue" });
        if ((sum.lastCheckinW || 0) < ps.week - 1 && ps.day >= 2) alerts.push({ tone: "muted", n: "Bilan S" + (ps.week - 1) + " non reçu : relancer", k: "bilans" });
      }
    }
    if (ps.phase === "fini") alerts.push({ tone: "muted", n: "Programme terminé : renouveler ou archiver", k: "plan" });
  }
  if (sum.lastCheckinW && !(row.replies && row.replies["w" + sum.lastCheckinW])) alerts.push({ tone: "gold", n: "Bilan S" + sum.lastCheckinW + " à lire" + (sum.lastQuestion ? " · question" : ""), k: "bilans" });
  const price = plan && plan.status === "active" ? offerPrice(settings, plan.offer, plan.weeks) : null;
  return { p, plan, prog, ps, sum, alerts, status, adherence, weekDone, weekPlanned, price };
}

function CoachOrders({ data, src, cid, demo, settings }) {

  const p = data.profile || {};
  const activate = async (o) => {
    if (demo) { toast("Exemple : rien n'est enregistré.", "warn"); return; }
    setBusy(true);
    try {
      const next = planFromOrder(data.plan, o, p, { kind: "coach", id: o.kind });
      await src.setPlan({ ...next, reviewedAt: nowISO() });
      const done = { ...o, status: "active", activatedAt: nowISO(), activatedBy: "coach" };
      await src.saveOrder(o.id, done);
      await src.setProfile({ ...p, access: accessSummary(done) });
      toast("Accès activé.", "ok");
    } catch (e) { toast("Activation impossible.", "bad"); } finally { setBusy(false); }
  };
  const refunded = async (o) => {
    setBusy(true);
    try {
      const done = { ...o, withdrawal: { ...o.withdrawal, refundedAt: nowISO() } };
      await src.saveOrder(o.id, done);
      if (data.plan && data.plan.source && data.plan.source.orderId === o.id) await src.setPlan({ ...data.plan, status: "archived", updatedAt: nowISO() });
      await src.setProfile({ ...p, access: accessSummary(done) });
      toast("Remboursement noté, accès clôturé.", "ok");
    } catch (e) { toast("Enregistrement impossible.", "bad"); } finally { setBusy(false); }
  };
  return html`<${Card} title="Commandes" sub="Paiements, codes et rétractations du client">
    ${orders.map((o) => html`<div key=${o.id} className="order">
      <div className="meal-h"><b>${PB[o.programId] ? PB[o.programId].n : "Programme"} · ${offerName(o.offer)} · ${durName(o.weeks)}${o.ext ? " (prolongation)" : ""}</b><${Pill} tone=${(ORDER_ST[o.status] || ORDER_ST.en_attente)[0]}>${(ORDER_ST[o.status] || ORDER_ST.en_attente)[1]}</${Pill}></div>

      ${o.withdrawal ? html`<p className="small warn-t">Rétractation le ${new Date(o.withdrawal.at).toLocaleString("fr-FR")} par ${o.withdrawal.name} · à rembourser : ${eur2(o.withdrawal.refund || 0)} (prorata)${o.withdrawal.refundedAt ? " · remboursé le " + fmtD(o.withdrawal.refundedAt) : ""}</p>` : null}
      <div className="btnrow">
        ${o.status === "en_attente" && !o.withdrawal ? html`<${Btn} small onClick=${() => activate(o)} disabled=${busy}>${o.kind === "code" ? "Activer le code" : "Paiement reçu · activer"}</${Btn}>` : null}

  </${Card}>`;
}
/* activation automatique des codes envoyés par les clients (version Claude, ou si l'activation par le client a échoué) */
function useAutoActivate(db, rows, codes) {
  const doneRef = useRef({});
  useEffect(() => {
    if (!db || !codes.ready) return;
    rows.forEach(async (r) => {
      if (r.demo) return;
      const o = r.profile && r.profile.access && r.profile.access.lastOrder;
      if (!o || o.kind !== "code" || o.status !== "en_attente" || !o.code || doneRef.current[o.id]) return;
      if (r.plan && r.plan.source && r.plan.source.orderId === o.id) return;
      doneRef.current[o.id] = 1;
      const c = codes.items[normCode(o.code)];
      const st = codeState(c, r.cid);
      if (!st.ok) return;
      const order = { ...o, offer: c.offer, weeks: Number(c.weeks), programId: c.programId || o.programId };
      try {
        const now = nowISO();
        await dbSet(db, "codes/" + normCode(o.code), { ...c, uses: (Number(c.uses) || 0) + 1, usedBy: { ...(c.usedBy || {}), [r.cid]: now } });
        const next = planFromOrder(r.plan, order, r.profile, { kind: "code", id: normCode(o.code) });
        await dbSet(db, "plans/" + r.cid, next);
        const done = { ...order, status: "active", activatedAt: now, activatedBy: "coach-auto" };
        await dbSet(db, "clients/" + r.cid + "/orders/" + o.id, done);
        await qwrite("clients/" + r.cid, () => db.doc("clients/" + r.cid).update({ access: clone(accessSummary(done)) }));
      } catch (e) { doneRef.current[o.id] = 0; }
    });
  }, [db, rows, codes.ready, codes.items]);
}

            <${Btn} small kind="quiet" onClick=${() => toggle(c)}>${c.active === false ? "Réactiver" : "Désactiver"}</${Btn}>${!(c.uses > 0) ? html`<${Btn} small kind="quiet" onClick=${() => remove(c)}>Supprimer</${Btn}>` : null}</div>

      <${Field} label="Tests"><div className="chips">${Object.entries(TESTS).map(([k, t]) => html`<button key=${k} type="button" className=${"chipbtn" + ((d.tests || []).includes(k) ? " on" : "")} aria-pressed=${(d.tests || []).includes(k)}

      <${Field} label="Habitudes quotidiennes (une par ligne)" id="pe-h"><textarea id="pe-h" rows="3" value=${(d.habits || []).join("\n")} onChange=${(e) => setD({ ...d, habits: e.target.value.split("\n").map((x) => x.trim()).filter(Boolean) })}></textarea></${Field}>

  </div>`;

function exerciseOptions(exo) {
  const custom = Object.values(exo || {}).filter((x) => x && x.custom);
  const all = [...EXLIB, ...custom];
  const cats = [...new Set(all.map((e) => e.c))];
  return cats.map((c) => ({ c, items: all.filter((e) => e.c === c).sort((a, b) => a.n.localeCompare(b.n)) }));
}
function SessionEditor({ s, onChange, exo }) {
  const opts = useMemo(() => exerciseOptions(exo), [exo]);
  const setItem = (i, it) => onChange({ items: s.items.map((x, k) => (k === i ? it : x)) });
  const move = (i, d) => { const a = s.items.slice(); const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; onChange({ items: a }); };
  const uid = useMemo(() => rid("se"), []);
  return html`<div className="form sess">
    <div className="row2"><${Field} label="Titre" id=${uid + "t"}><input id=${uid + "t"} value=${s.t || ""} onChange=${(e) => onChange({ t: e.target.value })} /></${Field}>
      <${Field} label="Lieu" id=${uid + "l"}><input id=${uid + "l"} value=${s.lieu || ""} onChange=${(e) => onChange({ lieu: e.target.value })} /></${Field}></div>
    <${Field} label="Objectif de la séance" id=${uid + "f"}><input id=${uid + "f"} value=${s.focus || ""} onChange=${(e) => onChange({ focus: e.target.value })} /></${Field}>
    <${Field} label="Échauffement" id=${uid + "w"}><textarea id=${uid + "w"} rows="2" value=${s.wu || ""} onChange=${(e) => onChange({ wu: e.target.value })}></textarea></${Field}>
    <div className="items">${s.items.map((it, i) => {
      const mode = it.w ? "libre" : (it.t || "H12");
      return html`<div className="item" key=${i}>
        <div className="item-h"><span className="exc-n">${i + 1}</span>
          <select id=${uid + "e" + i} aria-label="Exercice" value=${it.e} onChange=${(e) => setItem(i, { ...it, e: e.target.value })}>${opts.map((g) => html`<optgroup key=${g.c} label=${g.c}>${g.items.map((x) => html`<option key=${x.id} value=${x.id}>${x.n}</option>`)}</optgroup>`)}</select>
          <div className="item-btns"><button type="button" onClick=${() => move(i, -1)} aria-label="Monter">↑</button><button type="button" onClick=${() => move(i, 1)} aria-label="Descendre">↓</button>
            <button type="button" onClick=${() => onChange({ items: s.items.filter((_, k) => k !== i) })} aria-label="Retirer">×</button></div></div>

/* ===== Coach IA : accès à Claude, contexte du client, ajustements ===== */
let _aiP = null;
function getAI() {
  if (!_aiP) _aiP = (async () => {
    let s = null, images = false, tools = false, maxImages = 0;
    try { s = window.claude && typeof window.claude.use === "function" ? await window.claude.use("sample") : null; } catch (e) { s = null; }
    if (s) {
      try { const l = await s.limits(); images = !!(l && l.images); maxImages = images ? l.images.maxCount || 1 : 0; tools = !!(l && l.tools); } catch (e) {}
    }
    return { sample: s, images, tools, maxImages };
  })();
  return _aiP;
}
function useAI() {
  const [st, setSt] = useState({ ready: false, sample: null, images: false, tools: false, maxImages: 0 });
  useEffect(() => { let a = true; getAI().then((x) => { if (a) setSt({ ...x, ready: true }); }); return () => { a = false; }; }, []);
  return st;
}
const AI_ERR = {
  not_granted: "Tu n'as pas autorisé l'application à utiliser Claude. Tu peux l'activer depuis le menu Autorisations de la page.",
  sampling_disabled: "Le coach IA n'est pas disponible pour ton compte Claude.",
  rate_limited: "Trop de demandes pour le moment, ou limite d'utilisation de ton compte Claude atteinte. Réessaie un peu plus tard.",
  session_expired: "Reconnecte-toi à Claude, puis réessaie.",
  image_rejected: "Photo refusée : essaie une autre photo (JPEG ou PNG).",
  images_unavailable: "L'envoi de photos n'est pas disponible ici.",
  tools_unavailable: "Les ajustements automatiques ne sont pas disponibles ici.",
  refused: "Demande refusée : reformule ta question.",
  invalid_json: "Réponse illisible : réessaie.",
  empty_completion: "Pas de réponse : reformule ta demande.",
  prompt_too_large: "Demande trop longue : raccourcis-la.",
  upstream_error: "Service momentanément indisponible : réessaie dans un instant.",
};
function aiErr(e) { if (e && e.code === "cancelled") return ""; return AI_ERR[e && e.code] || AI_ERR.upstream_error; }
const AI_HIDE = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

const DEFAULT_AI_RULES = [
  "Pas de régime strict : 80 % d'aliments simples et peu transformés, 20 % de plaisir sans culpabilité.",
  "Des protéines à chaque repas, des légumes à au moins deux repas par jour, de l'eau en priorité.",
  "Progression des charges uniquement si la technique est propre et l'intensité demandée (RIR) respectée.",
  "En cas de doute sur une douleur : on allège et on me prévient.",
  "Encourage, félicite les efforts réels, reste honnête quand la régularité baisse.",
].join("\n");
function aiConf(settings, data) {
  const s = (settings && settings.ai) || (data && data.coachAi) || {};
  const al = s.allow || {};
  return { on: s.on !== false, rules: s.rules != null && String(s.rules).trim() ? String(s.rules) : DEFAULT_AI_RULES,
    allow: { nutri: al.nutri !== false, subst: al.subst !== false, charge: al.charge !== false } };

async function offLookup(ean) {
  if (!window.IS_SITE || !ean || typeof fetch !== "function") return null;
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(ean) + ".json?fields=product_name,product_name_fr,brands,nutriments,nutriscore_grade,serving_quantity", { signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) return null;
    const pr = j.product, nu = pr.nutriments || {};
    const g = (k) => num(nu[k + "_100g"]);
    let kcal = g("energy-kcal"); if (kcal === null && g("energy") !== null) kcal = Math.round(g("energy") / 4.184);
    if (kcal === null) return null;
    const ns = String(pr.nutriscore_grade || "").toUpperCase();
    const nsOk = /^[A-E]$/.test(ns) ? ns : null;
    return { ean, n: String(pr.product_name_fr || pr.product_name || "Produit").slice(0, 80), brand: String(pr.brands || "").split(",")[0].trim().slice(0, 60),
      per100: { kcal, p: g("proteins"), c: g("carbohydrates"), f: g("fat"), sucres: g("sugars"), fibres: g("fiber"), sel: g("salt") }, ok: true, estime: false, lisible: true,
      portion: Math.round(num(pr.serving_quantity) || 100), nutriscore: nsOk, verdict: nsOk ? VERDICT_NS[nsOk] : null, comment: "", alt: "", at: nowISO(), source: "off" };
  } catch (e) { return null; } finally { clearTimeout(tm); }
}

async function findProduct(db, ean) {
  if (!ean) return null;
  const loc = lsGet(PROD_KEY) || {};
  if (loc[ean]) return loc[ean];
  if (db) { try { const s = await db.doc("products/" + ean).get(); if (s.exists) { const p = s.data(); lsSet(PROD_KEY, { ...loc, [ean]: p }); return p; } } catch (e) {} }
  return null;
}
async function rememberProduct(db, ean, p) {
  if (!ean) return;
  const loc = lsGet(PROD_KEY) || {};
  lsSet(PROD_KEY, { ...loc, [ean]: p });
  if (db) { try { await db.doc("products/" + ean).set(clone(p)); } catch (e) {} }
}

/* ---------- ajout d'un repas : photo, description, saisie ---------- */
function AddMeal({ mode, np, tot, ai, onAdd, onClose }) {
  const toast = useToast();
  const eq = np && np.mode === "equilibre";
  const [slot, setSlot] = useState(slotNow());
  const [file, setFile] = useState(null);
  const [note, setNote] = useState("");

    if (!ai.sample) return;

    const c = new AbortController(); ctl.current = c;

        ? await ai.sample.json(mealPrompt("photo", np, tot, slot, note.trim()), { images: [file], signal: c.signal })

  };

    let meal;

      const extra = man.kcal || man.p || man.c || man.f || (!fdraft.items.length && man.n.trim()) ? [mkItem({ n: man.n.trim() || "Repas", g: 0, kcal: man.kcal, p: man.p, c: man.c, f: man.f })] : [];

        ${!draft ? html`<${Btn} onClick=${analyze} disabled=${busy}>${busy ? "Analyse en cours…" : "Analyser la photo"}</${Btn}>` : null}` : null}` : null}
    ${mode === "texte" ? html`<${Field} label="Ce que tu as mangé" id="meal-txt"><textarea id="meal-txt" rows="3" value=${note} onChange=${(e) => setNote(e.target.value)} placeholder="Ex. 2 œufs brouillés, 2 tranches de pain complet, un yaourt grec et un café"></textarea></${Field}>
      ${!draft ? html`<${Btn} onClick=${analyze} disabled=${busy || note.trim().length < 3}>${busy ? "Estimation…" : "Estimer"}</${Btn}>` : null}` : null}
    ${mode === "manuel" ? html`<${FoodPicker} onPick=${(it) => setFdraft({ ...fdraft, items: [...fdraft.items, it] })} />
      ${fdraft.items.length ? html`<${Card}><${MealEditor} draft=${{ ...fdraft, title: man.n.trim() || "Mon repas" }} setDraft=${(d) => setFdraft({ ...fdraft, items: d.items })} eq=${eq} /></${Card}>` : null}
      <${Field} label=${fdraft.items.length ? "Nom du repas (facultatif)" : "Repas"} id="mn-n"><input id="mn-n" value=${man.n} onChange=${(e) => setMan({ ...man, n: e.target.value })} placeholder="Ex. Salade de pâtes" /></${Field}>
      ${eq ? null : html`${fdraft.items.length ? html`<p className="muted small">Autre chose à ajouter ? Indique ses valeurs ci-dessous (facultatif).</p>` : null}<div className="row4"><${Field} label="kcal" id="mn-k"><input id="mn-k" inputMode="numeric" value=${man.kcal} onChange=${(e) => setMan({ ...man, kcal: e.target.value })} /></${Field}>

        <${Field} label="Glucides (g)" id="mn-c"><input id="mn-c" inputMode="decimal" value=${man.c} onChange=${(e) => setMan({ ...man, c: e.target.value })} /></${Field}>

  </div>`;
}

/* ---------- scan d'un produit ---------- */
function productPrompt(np, tot, ean, n) {
  return ["Tâche : analyse_produit. " + (n > 1 ? "Les photos montrent" : "La photo montre") + " un produit alimentaire emballé (face avant, tableau des valeurs nutritionnelles ou code-barres)." + (ean ? " Code-barres lu : " + ean + "." : ""),
    "Lis les valeurs pour 100 g (ou 100 ml) sur le tableau nutritionnel. Si le tableau n'est pas visible ou pas lisible, mets \"lisible\": false ; donne alors des valeurs typiques avec \"estime\": true seulement si tu reconnais le produit avec certitude, sinon mets les valeurs à null.",
    nutriShort(np, tot),
    'Réponds uniquement avec un objet JSON de cette forme : {"produit": "Skyr nature", "marque": "…", "ean": "les chiffres du code-barres s\'ils sont lisibles, sinon null", "lisible": true, "estime": false, "pour100": {"kcal": 64, "p": 11, "c": 4, "f": 0.2, "sucres": 4, "fibres": 0, "sel": 0.1}, "portion_g": 150, "nutriscore": "A", "verdict": "bon" | "occasionnel" | "a_limiter", "commentaire": "1 à 2 phrases pour ce client", "alternative": "une alternative plus intéressante si utile, sinon null"}'].join("\n");
}
function parseProduct(j, ean) {
  const p1 = (j && j.pour100) || {};
  const per = { kcal: num(p1.kcal), p: num(p1.p), c: num(p1.c), f: num(p1.f), sucres: num(p1.sucres), fibres: num(p1.fibres), sel: num(p1.sel) };
  return { ean: normEan(ean || (j && j.ean)) || null, n: String((j && j.produit) || "Produit").slice(0, 80), brand: j && j.marque ? String(j.marque).slice(0, 60) : "", per100: per,
    ok: per.kcal !== null, estime: !!(j && j.estime), lisible: !!(j && j.lisible), portion: num(j && j.portion_g) || 100, nutriscore: j && /^[A-E]$/.test(String(j.nutriscore || "")) ? j.nutriscore : null,
    verdict: j && j.verdict, comment: j && j.commentaire ? String(j.commentaire).slice(0, 300) : "", alt: j && j.alternative ? String(j.alternative).slice(0, 200) : "", at: nowISO() };
}
function ScanProduct({ np, tot, ai, db, onAdd, onClose }) {
  const toast = useToast();
  const eq = np && np.mode === "equilibre";
  const [st, setSt] = useState({ phase: "pick", ean: null, files: [], prod: null, err: "" });
  const [g, setG] = useState("");
  const [slot, setSlot] = useState(slotNow());
  const [typed, setTyped] = useState("");
  const [manual, setManual] = useState(false);
  const ctl = useRef(null);
  useEffect(() => () => { try { ctl.current && ctl.current.abort(); } catch (e) {} }, []);
  const showResult = (prod, ean, files) => { setG(String(Math.round(prod.portion || 100))); setManual(false); setSt({ phase: "result", ean, files: files || [], prod, err: "" }); };
  const lookup = async (ean, files) => {
    const known = await findProduct(db, ean);
    if (known) { showResult({ ...known, fromCache: true }, ean, files); return; }
    if (window.IS_SITE) {
      setSt({ phase: "lookup", ean, files: files || [], prod: null, err: "" });
      const off = await offLookup(ean);
      if (off) { await rememberProduct(db, ean, off); showResult(off, ean, files); return; }
    }
    setManual(!ai.images);
    setSt({ phase: "need_label", ean, files: files || [], prod: null, err: "" });
  };
  const saveManual = async (prod) => {
    if (prod.ean && prod.ok) await rememberProduct(db, prod.ean, prod);
    showResult(prod, prod.ean, st.files);
  };
  const analyze = async (files, ean) => {
    if (!ai.sample || !ai.images) { setManual(true); setSt((s) => ({ ...s, phase: "need_label", files, ean })); return; }
    setSt((s) => ({ ...s, phase: "analyzing", files, ean, err: "" }));
    const c = new AbortController(); ctl.current = c;
    try {
      const j = await ai.sample.json(productPrompt(np, tot, ean, files.length), { images: files.slice(0, Math.max(1, ai.maxImages || 1)), signal: c.signal });
      const prod = parseProduct(j, ean);
      if (!prod.ok) { setSt((s) => ({ ...s, phase: "need_label", ean: prod.ean || ean, err: "Je ne vois pas le tableau des valeurs nutritionnelles." })); return; }
      if (prod.ean && !prod.estime) await rememberProduct(db, prod.ean, prod);
      setG(String(Math.round(prod.portion || 100)));
      setSt((s) => ({ ...s, phase: "result", prod, ean: prod.ean || ean }));
    } catch (e) { const m = aiErr(e); setSt((s) => ({ ...s, phase: m ? "error" : "pick", err: m })); }
  };
  const onBarcode = async (f) => {
    setSt({ phase: "decoding", ean: null, files: [f], prod: null, err: "" });
    const ean = await decodeBarcode(f);
    if (ean) await lookup(ean, [f]);
    else { setManual(false); setSt({ phase: ai.images ? "need_label" : "pick", ean: null, files: ai.images ? [f] : [], prod: null, err: ai.images ? "Code-barres non lu : approche-toi, évite les reflets, ou photographie directement l'étiquette." : "Code-barres non lu : approche-toi, évite les reflets, ou tape les chiffres sous le code-barres." }); }
  };
  const add = async () => {
    const p = st.prod; const q = num(g) || 0;
    if (!p || !q) { toast("Indique la quantité.", "warn"); return; }
    const it = { n: p.n + (p.brand ? " (" + p.brand + ")" : ""), g: q, kcal: Math.round((p.per100.kcal || 0) * q / 100), p: Math.round((p.per100.p || 0) * q) / 100, c: Math.round((p.per100.c || 0) * q) / 100, f: Math.round((p.per100.f || 0) * q) / 100 };
    await onAdd({ id: rid("m"), slot, at: nowISO(), src: "produit", ean: p.ean || null, title: p.n, items: [it], kcal: it.kcal, p: Math.round(it.p), c: Math.round(it.c), f: Math.round(it.f), verdict: p.verdict || null, comment: p.comment || "" });
    onClose();
  };
  const p = st.prod; const q = num(g) || 0;
  const typedEan = normEan(typed);
  const restart = () => { setManual(false); setTyped(""); setSt({ phase: "pick", ean: null, files: [], prod: null, err: "" }); };
  return html`<div className="form">
    ${st.phase === "pick" || st.phase === "error" ? html`<p className="small">Photographie le code-barres, bien à plat et net. Un produit déjà scanné par toi ou un autre client est reconnu tout de suite ; ${ai.images ? "sinon, le coach IA lit l'étiquette." : window.IS_SITE ? "sinon, il est cherché dans Open Food Facts, ou tu l'ajoutes en 20 secondes." : "sinon, tu l'ajoutes en 20 secondes."}</p>
      ${st.err && st.phase === "pick" ? html`<p className="small warn-t">${st.err}</p>` : null}
      <${PhotoPick} id="scan-bc" label="Photographier le code-barres" onFile=${onBarcode} />
      ${ai.images ? html`<${PhotoPick} id="scan-lab0" kind="ghost" label="Photographier directement l'étiquette" onFile=${(f) => analyze([f], null)} />` : null}
      <div className="row-end"><${Field} label="Ou tape les chiffres du code-barres" id="scan-typed"><input id="scan-typed" inputMode="numeric" value=${typed} onChange=${(e) => setTyped(e.target.value)} placeholder="13 chiffres" onKeyDown=${(e) => { if (e.key === "Enter" && typedEan) lookup(typedEan, []); }} /></${Field}>
        <${Btn} kind="ghost" onClick=${() => lookup(typedEan, [])} disabled=${!typedEan}>Chercher</${Btn}></div>` : null}
    ${st.phase === "decoding" ? html`<p className="muted">Lecture du code-barres…</p>` : null}
    ${st.phase === "lookup" ? html`<p className="muted">Recherche du produit ${st.ean}…</p>` : null}
    ${st.phase === "need_label" ? html`<div className="stack-s">${st.ean ? html`<p className="small">Code-barres <b>${st.ean}</b> : produit pas encore connu.</p>` : null}
      ${st.err ? html`<p className="small warn-t">${st.err}</p>` : null}
      ${ai.images && !manual ? html`<p className="small">Photographie maintenant le <b>tableau des valeurs nutritionnelles</b> (au dos du paquet). Le produit sera ensuite reconnu directement.</p>
        <${PhotoPick} id="scan-lab" label="Photographier l'étiquette" onFile=${(f) => analyze([...st.files.slice(0, 1), f], st.ean)} />
        <button type="button" className="linkbtn" onClick=${() => setManual(true)}>Saisir les valeurs à la main</button>` : null}
      ${manual ? html`<${Card} title="Ajouter ce produit"><${ProductForm} ean=${st.ean} eq=${eq} onSave=${saveManual} /></${Card}>` : null}
      <${Btn} kind="quiet" onClick=${restart}>Recommencer</${Btn}></div>` : null}
    ${st.phase === "analyzing" ? html`<div className="actions"><span className="muted small">Le coach IA lit l'étiquette… (10 à 40 s)</span><${Btn} kind="quiet" small onClick=${() => ctl.current && ctl.current.abort()}>Stop</${Btn}></div>` : null}
    ${st.phase === "error" && st.err ? html`<p className="small warn-t">${st.err}</p>` : null}
    ${st.phase === "result" && p ? html`<${Card}>
      <div className="meal-h"><b>${p.n}</b>${p.brand ? html`<span className="muted small">${p.brand}</span>` : null}${p.nutriscore ? html`<span className=${"ns ns-" + p.nutriscore}>Nutri-Score ${p.nutriscore}</span>` : null}${VERDICT[p.verdict] ? html`<${Pill} tone=${VERDICT[p.verdict].t}>${VERDICT[p.verdict].n}</${Pill}>` : null}</div>
      ${p.fromCache ? html`<p className="muted small">Reconnu grâce au code-barres ${p.ean}.</p>` : p.estime ? html`<p className="small warn-t">Valeurs typiques estimées : vérifie l'étiquette si possible.</p>` : null}
      ${p.source === "off" ? html`<p className="muted small">Données Open Food Facts (base collaborative, licence ODbL) : vérifie l'étiquette en cas de doute.</p>` : null}
      ${eq ? null : html`<div className="kvs">${[["Énergie", p.per100.kcal, "kcal"], ["Protéines", p.per100.p, "g"], ["Glucides", p.per100.c, "g"], ["dont sucres", p.per100.sucres, "g"], ["Lipides", p.per100.f, "g"], ["Fibres", p.per100.fibres, "g"], ["Sel", p.per100.sel, "g"]].filter((x) => x[1] !== null && x[1] !== undefined).map(([n, v, u]) => html`<div key=${n} className="kv"><span>${n} / 100 g</span><b>${fmtN(v, 1)} ${u}</b></div>`)}</div>`}
      ${p.comment ? html`<p className="small">${p.comment}</p>` : null}${p.alt ? html`<p className="small note">Alternative : ${p.alt}</p>` : null}
    </${Card}>
    <div className="row2"><${Field} label="Quantité mangée (g)" id="scan-g"><input id="scan-g" inputMode="decimal" value=${g} onChange=${(e) => setG(e.target.value)} /></${Field}>
      ${eq ? null : html`<div className="field"><span className="field-l">Pour cette quantité</span><div className="tot-line"><b>${fmtN((p.per100.kcal || 0) * q / 100, 0)} kcal</b><span>P ${fmtN((p.per100.p || 0) * q / 100, 0)} g · G ${fmtN((p.per100.c || 0) * q / 100, 0)} g · L ${fmtN((p.per100.f || 0) * q / 100, 0)} g</span></div></div>`}</div>
    <${SlotPick} value=${slot} onChange=${setSlot} />
    <div className="actions"><${Btn} onClick=${add} disabled=${!q}>Ajouter au journal</${Btn}><${Btn} kind="quiet" onClick=${restart}>Scanner un autre produit</${Btn}></div>` : null}
  </div>`;
}

/* ---------- objectif ---------- */

  const calc = f.sex && !eqMode ? nutriCalc({ ...f, weeks }, sessions) : null;
  const ok = !!f.sex && (eqMode || (calc && !calc.error)) && (f.goal === "maintien" || eqMode || num(f.delta) > 0);
  const save = () => {
    const form = { ...f };
    if (eqMode) { onSave({ mode: "equilibre", form: { ...form, ted: false, preg: false }, start: todayISO(), createdAt: nowISO(), prefs: f.prefs.trim(), reason: minor ? "mineur" : "" }); return; }
    onSave({ mode: "calories", form: { ...form, ted: false, preg: false }, sex: calc.sex, age, height: num(f.height), weight0: num(f.weight), goal: f.goal, delta: f.goal === "maintien" ? 0 : num(f.delta), weeks: f.goal === "maintien" ? weeks : Math.round(calc.weeksReal || weeks),
      target: calc.target, rate: calc.rate, tdee: calc.tdee, bmr: calc.bmr, floor: calc.floor, refW: calc.refW, targets: calc.targets, status: calc.status, prefs: f.prefs.trim(), start: todayISO(), createdAt: (np && np.createdAt) || nowISO(), updatedAt: nowISO(),
      history: [...((np && np.history) || []), { at: nowISO(), by: "client", after: calc.targets, reason: "Nouvel objectif : " + (f.goal === "maintien" ? "maintien" : f.goal + " de " + f.delta + " kg en " + f.months + " mois") }].slice(-30) });
  };
  const st = calc && !calc.error ? { ok: ["ok", "Objectif réaliste"], ambitieux: ["gold", "Ambitieux mais faisable"], rapide: ["warn", "Trop rapide"] }[calc.status] : null;
  return html`<div className="stack">
    <${Card} title="Toi">
      <div className="form">
        <${Field} label="Sexe"><${Seg} options=${[{ v: "H", n: "Homme" }, { v: "F", n: "Femme" }]} value=${f.sex} onChange=${(v) => set("sex", v)} /></${Field}>
        <div className="row4"><${Field} label="Âge" id="nu-a"><input id="nu-a" inputMode="numeric" value=${f.age} onChange=${(e) => set("age", e.target.value)} /></${Field}>
          <${Field} label="Taille (cm)" id="nu-h"><input id="nu-h" inputMode="numeric" value=${f.height} onChange=${(e) => set("height", e.target.value)} /></${Field}>
          <${Field} label="Poids (kg)" id="nu-w"><input id="nu-w" inputMode="decimal" value=${f.weight} onChange=${(e) => set("weight", e.target.value)} /></${Field}></div>
        <${Field} label="Activité en dehors de tes séances" hint=${(ACT.find((x) => x.v === f.act) || {}).d}><${Seg} options=${ACT.map((x) => ({ v: x.v, n: x.n }))} value=${f.act} onChange=${(v) => set("act", v)} /></${Field}>
      </div></${Card}>
    <${Card} title="Ton objectif">
      <div className="form">
        <${Seg} options=${[{ v: "perte", n: "Perdre du poids" }, { v: "maintien", n: "Garder mon poids" }, { v: "prise", n: "Prendre du muscle" }]} value=${f.goal} onChange=${(v) => set("goal", v)} />
        ${f.goal !== "maintien" ? html`<div className="row2"><${Field} label=${f.goal === "perte" ? "Kilos à perdre" : "Kilos à prendre"} id="nu-d"><input id="nu-d" inputMode="decimal" value=${f.delta} onChange=${(e) => set("delta", e.target.value)} placeholder=${f.goal === "perte" ? "10" : "3"} /></${Field}>
          <${Field} label="En combien de mois ?"><${Seg} options=${["1", "2", "3", "4", "6", "9", "12"].map((m) => ({ v: m, n: m }))} value=${f.months} onChange=${(v) => set("months", v)} /></${Field}></div>` : null}

      <div className="tiles">
        <div className="tile"><b>${fmtN(calc.targets.kcal, 0)}</b><span>kcal par jour</span></div>
        <div className="tile"><b>${fmtN(calc.targets.p, 0)} g</b><span>protéines</span></div>
        <div className="tile"><b>${fmtN(calc.targets.steps, 0)}</b><span>pas par jour</span></div>
        <div className="tile"><b>${sessions || "—"}</b><span>séances par semaine</span></div>
      </div>
      <p className="small">Glucides ${fmtN(calc.targets.c, 0)} g · lipides ${fmtN(calc.targets.f, 0)} g · eau ${fmtN(calc.targets.water, 1)} L · dépense estimée ${fmtN(calc.tdee, 0)} kcal par jour.</p>
      ${f.goal !== "maintien" ? html`<p className="small">Rythme : ${fmtN(Math.abs(calc.rate), 2)} kg par semaine → ${fmtN(calc.target, 1)} kg vers le ${fmtD(addDays(todayISO(), Math.round((calc.weeksReal || weeks) * 7)))}.</p>` : null}

      ${calc.targets.kcal <= calc.floor ? html`<p className="small warn-t">Calories au plancher de sécurité (${fmtN(calc.floor, 0)} kcal) : l'objectif prendra plus de temps.</p>` : null}
    </${Card}>` : null}
    <div className="actions"><${Btn} onClick=${save} disabled=${!ok}>Enregistrer mon objectif</${Btn}>${onCancel ? html`<${Btn} kind="quiet" onClick=${onCancel}>Annuler</${Btn}>` : null}</div>
  </div>`;
}
function TrajChart({ np, pts }) {
  const ref = useRef(null);
  const W = useWidth(ref);
  const H = 180;
  if (!np || np.mode === "equilibre" || np.goal === "maintien") return null;
  const total = Math.max(14, Math.round(np.weeks * 7));
  const xs = (d) => diffDays(np.start, d);
  const data = pts.filter((p) => xs(p.d) >= -14);
  const ys = [np.weight0, np.target, ...data.map((p) => p.v)];
  let mn = Math.min(...ys), mx = Math.max(...ys); if (mx - mn < 2) { mn -= 1; mx += 1; }
  const ticks = niceTicks(mn, mx, 3); const lo = ticks[0], hi = ticks[ticks.length - 1];
  const L = 40, R = 12, T = 12, B = 24;
  const x = (dd) => L + (W - L - R) * clamp((dd + 0) / total, 0, 1);
  const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
  const today = xs(todayISO());
  return html`<div ref=${ref} className="chart"><svg width=${W} height=${H} role="img" aria-label=${"Trajectoire prévue de " + fmtN(np.weight0) + " à " + fmtN(np.target) + " kg"}>
    ${ticks.map((t) => html`<g key=${t}><line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} style=${{ stroke: "var(--grid)" }}></line><text x=${L - 6} y=${y(t) + 4} textAnchor="end" className="ax">${fmtN(t, 0)}</text></g>`)}
    <line x1=${x(0)} y1=${y(np.weight0)} x2=${x(total)} y2=${y(np.target)} style=${{ stroke: "var(--gold)", strokeWidth: 2, strokeDasharray: "6 5", opacity: 0.8 }}></line>
    ${today >= 0 && today <= total ? html`<line x1=${x(today)} x2=${x(today)} y1=${T} y2=${H - B} style=${{ stroke: "var(--muted)", strokeDasharray: "2 3" }}></line>` : null}
    ${data.map((p, i) => html`<circle key=${i} cx=${x(Math.max(0, xs(p.d)))} cy=${y(p.v)} r="4.5" style=${{ fill: "var(--gold)", stroke: "var(--surface)", strokeWidth: 2 }}></circle>`)}
    <text x=${L} y=${H - 6} className="ax">${fmtD(np.start)}</text><text x=${W - R} y=${H - 6} textAnchor="end" className="ax">${fmtD(addDays(np.start, total))}</text>
  </svg><div className="chart-val"><span className="muted">Pointillé : trajectoire prévue · points : tes pesées (bilans et tests)</span></div></div>`;
}

/* ---------- cohérence objectif / profil / sport ---------- */
function assessPlan({ programId, niveau, ans, sport, age, equipment, screeningFlag, prereqOk, weeks, compDate, start }) {
  const out = [];

  const cat = sportCat(sport);
  const rec = PROG_FOR_SPORT[cat] || [];
  const r = nivRank(niveau);
  const push = (t, n) => out.push({ t, n });

  else if (rec.includes(programId)) push("ok", "Programme adapté à un " + SPORT_LABEL[cat] + ".");
  else if (cat !== "aucun" && cat !== "autre" && rec.length) push("info", "Pour un " + SPORT_LABEL[cat] + ", « " + PB[rec[0]].n + " » est souvent plus spécifique. Ton choix reste possible.");
  if (programId === "forme" && r >= nivRank("perf")) push("warn", "« Remise en forme » est peu exigeant pour ton niveau : « " + PB[rec[0] && rec[0] !== "forme" ? rec[0] : "prepa"].n + " » te fera davantage progresser.");
  if ((programId === "force" || programId === "vitesse") && niveau === "reprise") push("warn", "Programme technique et intense : en profil Reprise, les charges et les sprints sont allégés. La formule Hybride permet d'apprendre les mouvements avec Antoine.");
  if (programId === "force" && Number(ans && ans.xp) <= 1) push("warn", "Les mouvements d'haltérophilie demandent un apprentissage : commence léger, filme-toi et envoie la vidéo à ton coach.");
  if (programId === "masse" && cat === "course") push("info", "La prise de muscle peut alourdir ta foulée : idéale hors saison de course.");
  if (programId === "retour" && !prereqOk) push("bad", "Les critères de reprise de la course ne sont pas tous remplis : poursuis ta rééducation avec ton kiné avant ce programme.");
  if (programId === "retour" && prereqOk) push("ok", "Critères de reprise remplis : reprise progressive guidée par la douleur (3/10 au plus).");
  if (equipment === "maison" && prog && !prog.maison) push("bad", "Ce programme demande une salle : choisis « En salle » ou un programme avec version maison.");
  const f = Number(ans && ans.freq);
  if (f === 2) push("warn", "3 séances prévues par semaine : avec 2 séances, fais A et C en priorité.");
  if (f >= 4 && niveau === "elite" && CONTENT.SESDFOR && CONTENT.SESDFOR[programId]) push("ok", "Séance D optionnelle ajoutée (vitesse et robustesse).");
  if (age !== null && age < 18) push("info", "Moins de 18 ans : pas de test de charge maximale, charges guidées par les répétitions en réserve.");
  if (screeningFlag) push("warn", "Questionnaire santé : demande l'avis de ton médecin. En attendant, séances en mode Reprise.");
  if (compDate && start && weeks) {

  }

}

const READY_ITEMS = [["sommeil", "Sommeil de la nuit", "Très mauvais", "Excellent"], ["fatigue", "Énergie", "Épuisé", "En pleine forme"], ["courbatures", "Courbatures", "Très fortes", "Aucune"], ["stress", "Stress", "Très stressé", "Détendu"], ["moral", "Envie de t'entraîner", "Aucune", "Très forte"]];

    if (ready && ready.lvl === "leger" && /vite|%|max|allure/i.test(text)) lines.push("Forme basse : intensité à 80-90 % aujourd'hui.");

  const t = T[it.t] || T.C;

    if (it.t === "P") lines.push("Chaque répétition à vitesse maximale, réception gainée ; repose la barre entre les répétitions si la technique se dégrade.");
  }
  if (r >= 2 && it.t === "PL") lines.push((sets * (rangeOf(reps) || [5])[0]) + " contacts au total : temps au sol le plus court possible, qualité avant quantité.");
  if (r >= 2 && it.t === "S") {

}

  const ready = !!prog && cgv && (!minor || parent) && !blocking && (!needEarly || early);
  async function saveReq(order) {
    const next = { ...p, request: { ...req, programId, niveau: f.niveau, offer, weeks, start: f.start, equipment: order.equipment, compDate: f.compDate || null, code: order.code || null }, access: accessSummary(order) };
    await src.setProfile(next);
    await src.saveOrder(order.id, order);
  }
  async function go() {
    if (!ready || busy) return;
    setBusy(true);
    try {
      if (codeC && window.IS_SITE && db) {
        /* « activation » : le client active lui-même ; l'espace coach n'y touche pas (évite une double activation) */
        const order = { ...mkOrder("code"), status: "activation" };
        await saveReq(order);
        try { await redeemCode(db, uid, codeC.code, order, prev, p); }
        catch (e) {
          const s = await db.doc("plans/" + uid).get().catch(() => null);
          const pl = s && s.exists ? s.data() : null;
          if (!(pl && pl.source && pl.source.orderId === order.id)) { await src.saveOrder(order.id, { ...order, status: "annulee" }).catch(() => {}); throw e; }
        }
        try { localStorage.removeItem("pending_code"); } catch (e) {}
        toast("Accès activé : bon entraînement !", "ok");
        onDone && onDone();
        return;
      }
      if (cst && cst.pendingCoach) {
        const order = mkOrder("code");
        await saveReq(order);
        setSent({ kind: "code" });
        return;
      }
      const order = mkOrder(link ? "paiement" : "manuel");
      await saveReq(order);
      if (link) {
        const url = stripeUrl(link, uid || data.cid || "client", order, p.email);
        if (window.IS_SITE) { window.location.href = url; return; }
        try { window.open(url, "_blank", "noopener"); } catch (e) {}
        setSent({ kind: "paiement", url });
      } else setSent({ kind: "manuel" });
    } catch (e) {
      toast(e && e.code === "permission-denied" ? "Activation refusée : ce code n'est plus valable." : "Commande impossible : vérifie ta connexion et réessaie.", "bad");
    } finally { setBusy(false); }
  }
  if (sent) return html`<div className="stack">
    <div className="alert okb"><div><b>${sent.kind === "code" ? "Code envoyé à ton coach" : "Commande enregistrée"}</b>
      <p>${sent.kind === "code" ? "Ton accès s'active dès qu'Antoine ouvre l'application (en général dans la journée)." : sent.kind === "paiement" ? "Termine ton paiement sur la page Stripe ouverte dans un nouvel onglet. Ton accès s'active dès qu'Antoine a vu ton paiement." : "Antoine te contacte pour le paiement et active ton accès dès réception."}</p></div></div>
    ${sent.url ? html`<a className="btn ghost" href=${sent.url} target="_blank" rel="noopener">Rouvrir la page de paiement</a>` : null}
    ${settings && settings.pay && settings.pay.info && sent.kind === "manuel" ? html`<${Card} title="Paiement"><p className="small">${settings.pay.info}</p></${Card}>` : null}
  </div>`;
  const durs = (codeC ? [] : DURS);
  return html`<div className="stack form">
    ${mode === "renew" ? html`<p className="muted small">${prev ? "Ton programme actuel : " + (PB[prev.programId] ? PB[prev.programId].n : "") + ", " + durName(prev.weeks) + (prevEnd ? ", fin le " + fmtD(prevEnd) : "") + "." : ""}</p>` : null}
    <${Field} label="Programme" id="pu-prog"><select id="pu-prog" value=${programId} disabled=${!!(codeC && codeC.programId)} onChange=${(e) => set("programId", e.target.value)}>
      <option value="">Choisir</option>${PROGS.map((x) => html`<option key=${x.id} value=${x.id}>${x.n}</option>`)}</select></${Field}>
    ${extOk ? html`<${Field} label="Suite"><${Seg} options=${[{ v: true, n: "Continuer (semaines " + (Number(prev.weeks) + 1) + " à " + (Number(prev.weeks) + weeks) + ")" }, { v: false, n: "Recommencer à la semaine 1" }]} value=${ext} onChange=${setExt} /></${Field}>` : null}
    <div className="field"><span className="field-l">Ton profil</span><${NiveauCards} value=${f.niveau} onChange=${(v) => set("niveau", v)} recommended=${rec.id} />
      ${rec.why.length ? html`<span className="field-h">${rec.why.join(" ")}</span>` : null}</div>
    ${codeC ? html`<div className="alert okb"><div><b>Code ${codeC.code}</b><p>${codeSummary(codeC)} : accès offert, rien à payer.</p></div><button type="button" className="linkbtn" onClick=${() => { setCst(null); setCode(""); }}>Retirer</button></div>` : html`
      <${Field} label="Formule"><${Seg} options=${OFFERS.map((o) => ({ v: o.id, n: o.n }))} value=${f.offer} onChange=${(v) => set("offer", v)} /></${Field}>
      <p className="muted small">${(OFFERS.find((o) => o.id === f.offer) || {}).desc || ""}</p>
      <${Field} label="Durée"><${Seg} options=${durs.filter((d) => !isExt || Number(prev.weeks) + d.w <= 12).map((d) => ({ v: d.w, n: d.n + " · " + eur(priceOf(settings, f.offer, d.w)) }))} value=${Number(f.weeks)} onChange=${(v) => set("weeks", v)} /></${Field}>`}
    ${!isExt || prevEnd < todayISO() ? html`<div className="row2"><${Field} label=${isExt ? "Reprise le" : "Début"} id="pu-start"><input id="pu-start" type="date" min=${todayISO()} value=${f.start} onChange=${(e) => set("start", e.target.value)} /></${Field}>
      ${prog && prog.maison ? html`<${Field} label="Lieu"><${Seg} options=${[{ v: "salle", n: "En salle" }, { v: "maison", n: "À la maison" }]} value=${f.equipment} onChange=${(v) => set("equipment", v)} /></${Field}>` : null}</div>` : null}
    ${nivRank(f.niveau) >= 2 ? html`<${Field} label="Prochaine compétition importante (facultatif)" id="pu-comp" hint="Pour programmer l'affûtage des deux semaines précédentes."><input id="pu-comp" type="date" value=${f.compDate} onChange=${(e) => set("compDate", e.target.value)} /></${Field}>` : null}
    <${Card} title="Vérification de ton plan"><${FitChecks} checks=${checks} /></${Card}>
    ${!codeC ? html`<div className="row-end"><${Field} label="Tu as un code d'essai ou un code offert ?" id="pu-code"><input id="pu-code" value=${code} onChange=${(e) => { setCode(e.target.value); setCst(null); }} placeholder="ESSAI-XXXXXXX" autoComplete="off" /></${Field}>
      <${Btn} kind="ghost" onClick=${() => check(code)} disabled=${!normCode(code)}>Appliquer</${Btn}></div>
      ${cst && !cst.ok ? html`<p className="small warn-t" role="alert">${cst.why}</p>` : null}
      ${cst && cst.pendingCoach ? html`<p className="small">Code ${cst.code} : il sera vérifié par Antoine à l'activation.</p>` : null}` : null}
    <${Card} title="Récapitulatif">
      <dl className="dl"><dt>Programme</dt><dd>${prog ? prog.n : "—"}</dd><dt>Profil</dt><dd>${nivName(f.niveau)}</dd><dt>Formule</dt><dd>${offerName(offer)}</dd>
        <dt>Durée</dt><dd>${durName(weeks)}${isExt ? " de plus (jusqu'à " + durName(Number(prev.weeks) + weeks) + " au total)" : ""}</dd>
        <dt>${isExt ? "Suite" : "Début"}</dt><dd>${fmtDY(startCont)}</dd><dt>Prix</dt><dd><b>${price === 0 ? "Offert" : price === null ? "—" : eur(price)}</b></dd></dl>
      <p className="muted small">${tvaLine(settings)}. Paiement unique, sans abonnement ni renouvellement automatique.${weeks ? " Accès du " + fmtD(startCont) + " au " + fmtD(addDays(startCont, weeks * 7 - 1)) + " inclus." : ""}</p></${Card}>
    <label className="chk"><input type="checkbox" id="pu-cgv" checked=${cgv} onChange=${(e) => setCgv(e.target.checked)} /><span>J'ai lu et j'accepte les <button type="button" className="linkbtn" onClick=${() => setLegal("cgv")}>conditions générales de vente</button> et la <button type="button" className="linkbtn" onClick=${() => setLegal("confidentialite")}>politique de confidentialité</button>.</span></label>
    ${needEarly ? html`<label className="chk"><input type="checkbox" id="pu-early" checked=${early} onChange=${(e) => setEarly(e.target.checked)} /><span>Je demande que mon accompagnement commence dès l'activation, avant la fin du délai de rétractation de 14 jours. Je sais que si je me rétracte, je paierai la part du service déjà fournie.</span></label>` : null}
    ${minor ? html`<label className="chk"><input type="checkbox" id="pu-parent" checked=${parent} onChange=${(e) => setParent(e.target.checked)} /><span>Je suis le parent ou le tuteur légal de ${p.name || "l'enfant"} et je passe cette commande pour lui.</span></label>` : null}
    ${blocking ? html`<p className="small warn-t">Corrige d'abord le point bloquant ci-dessus.</p>` : null}
    <${Btn} block onClick=${go} disabled=${!ready || busy || price === null}>${busy ? "Un instant…" : codeC ? "Activer mon accès offert" : cst && cst.pendingCoach ? "Envoyer mon code à Antoine" : "Commander avec obligation de paiement · " + eur(price)}</${Btn}>
    ${!codeC && !(cst && cst.pendingCoach) && price ? html`<p className="muted small center">${link ? "Paiement sécurisé par Stripe. Tes coordonnées bancaires ne passent jamais par ce site." : "Antoine te contacte pour le paiement (virement, carte ou espèces) puis active ton accès."}</p>` : null}
    <${Modal} open=${!!legal} wide title=${legal === "cgv" ? "Conditions générales de vente" : "Politique de confidentialité"} onClose=${() => setLegal(null)}>${legal ? html`<${LegalDoc} kind=${legal} settings=${settings} />` : null}</${Modal}>
  </div>`;
}

/* ---------- écran d'accès (pas encore de programme actif) ---------- */
function AccessScreen({ data, src, settings, db, uid, lib, coach, state }) {
  const p = data.profile || {};
  const req = p.request || {};
  const prog = progOf(req.programId, lib);
  const last = p.access && p.access.lastOrder;
  const [testOpen, setTestOpen] = useState(false);
  const [edit, setEdit] = useState(false);
  const back = (() => { try { return new URLSearchParams(location.search).get("paiement"); } catch (e) { return null; } })();
  const waitingPay = window.IS_SITE && back === "ok" && state !== "actif";
  const pendingOrder = last && last.status === "en_attente" && !edit;
  const fakePlan = { weeks: req.weeks || 12, start: req.start || nextMonday() };
  return html`<div className="stack">
    <header className="c-top"><${Brand} sub="Mon accès" /></header>

      <p className="muted">${prog ? prog.n + " · profil " + nivName(req.niveau) + " · formule " + offerName(req.offer) + " · " + durName(req.weeks) : "Choisis ton programme"}</p></div>
    ${state === "retracte" ? html`<${Card} title="Et maintenant ?"><p className="small">${coach && coach.name || COACH_NAME_DEFAULT} te rembourse sous 14 jours, au prorata du service déjà fourni, avec le moyen de paiement utilisé. Tu peux commander à nouveau quand tu veux.</p></${Card}>` : null}
    ${waitingPay ? html`<div className="alert gold"><div><b>Paiement reçu par Stripe</b><p>${payMode(settings) === "auto" ? "Activation en cours : ton programme s'affiche dans quelques secondes." : "Antoine confirme ton paiement et active ton accès (en général dans la journée)."}</p></div></div>` : null}
    ${pendingOrder && !waitingPay ? html`<div className="alert gold"><div><b>${last.kind === "code" ? "Code en attente d'activation" : last.kind === "paiement" ? "Commande en attente de paiement" : "Commande enregistrée"}</b>
      <p>${last.kind === "code" ? "Ton code " + (last.code || "") + " sera activé par Antoine dès qu'il ouvre son espace." : last.kind === "paiement" ? "Si tu as payé, ton accès s'active dès la confirmation. Sinon, reprends ton paiement." : "Antoine te contacte pour le paiement et active ton accès dès réception."} Commande du ${fmtD(last.at)} · ${last.kind === "code" ? "code " + (last.code || "") : eur(Number(last.price) || 0)}.</p>
      ${last.kind === "manuel" && settings && settings.pay && settings.pay.info ? html`<p>${settings.pay.info}</p>` : null}</div>
      <div className="btnrow">${last.kind === "paiement" && payLinkOf(settings, last.offer, last.weeks) ? html`<${Btn} small onClick=${() => { const u = stripeUrl(payLinkOf(settings, last.offer, last.weeks), uid || "client", last, p.email); if (window.IS_SITE) window.location.href = u; else window.open(u, "_blank", "noopener"); }}>Reprendre le paiement</${Btn}>` : null}
        <${Btn} small kind="ghost" onClick=${() => setEdit(true)}>Modifier ma commande</${Btn}></div></div>` : null}
    ${!pendingOrder || edit ? html`<${Card} title=${state === "termine" ? "Ma prochaine période" : "Ma commande"}><${Purchase} data=${data} src=${src} settings=${settings} db=${db} uid=${uid} lib=${lib} mode=${data.plan ? "renew" : "first"} onDone=${() => setEdit(false)} /></${Card}>` : null}
    ${prog && state !== "termine" ? html`<${Card} title="En attendant : tes tests de départ" sub="Ils servent de point de comparaison.">
      <${Btn} kind="ghost" onClick=${() => setTestOpen(true)}>${data.tests.t0 ? "Modifier mes tests" : "Saisir mes tests"}</${Btn}></${Card}>` : null}
    ${prog && prog.prereq ? html`<${Prereq} prog=${prog} />` : null}
    <${OrdersCard} data=${data} src=${src} settings=${settings} />
    ${window.IS_SITE ? html`<${SignOutLink} />` : null}
    <${Modal} open=${testOpen} title="Mes tests de départ" onClose=${() => setTestOpen(false)}>
      ${testOpen && prog ? html`<${TestsForm} prog=${prog} plan=${fakePlan} data=${data} src=${src} point=${0} onDone=${() => setTestOpen(false)} />` : null}
    </${Modal}>
  </div>`;
}

/* ---------- mes commandes et rétractation (art. L221-21 : « renoncer au contrat ici ») ---------- */
const ORDER_ST = { activation: ["gold", "Activation…"], en_attente: ["gold", "En attente"], payee: ["ok", "Payée"], active: ["ok", "Active"], retractee: ["warn", "Rétractée"], annulee: ["muted", "Annulée"] };
function orderText(o, settings, kind) {
  const L = legalInfo(settings);
  const lines = kind === "retractation" ? [
    "ACCUSÉ DE RÉCEPTION DE RÉTRACTATION", "", L.marque + " — " + L.editeur + (L.siret ? " — SIRET " + L.siret : ""), L.adresse, L.email, "",
    "Nous accusons réception de ta rétractation.", "Reçue le : " + new Date(o.withdrawal.at).toLocaleString("fr-FR"), "Consommateur : " + o.withdrawal.name, "E-mail : " + (o.withdrawal.email || "—"),
    "Contrat : commande " + o.id + " du " + fmtDY(String(o.at).slice(0, 10)) + " — " + (PB[o.programId] ? PB[o.programId].n : o.programId) + ", formule " + offerName(o.offer) + ", " + durName(o.weeks) + ", " + eur(Number(o.paidAmount ?? o.price) || 0),
    "", "Remboursement sous 14 jours avec le moyen de paiement utilisé, au prorata du service fourni jusqu'à ta rétractation (article L221-25 du code de la consommation)."]
    : ["RÉCAPITULATIF DE COMMANDE", "", L.marque + " — " + L.editeur + (L.siret ? " — SIRET " + L.siret : ""), L.adresse, L.email, "",
      "Commande : " + o.id + " du " + new Date(o.at).toLocaleString("fr-FR"), "Programme : " + (PB[o.programId] ? PB[o.programId].n : o.programId) + " — profil " + nivName(o.niveau),
      "Formule : " + offerName(o.offer) + " — " + durName(o.weeks) + " — début " + fmtDY(o.contStart || o.start), "Prix : " + (o.kind === "code" ? "offert (code " + o.code + ")" : eur(Number(o.price) || 0)) + " — " + tvaLine(settings),
      "Conditions générales de vente acceptées : version " + ((o.cgv && o.cgv.v) || CGV_VERSION) + " le " + (o.cgv ? new Date(o.cgv.at).toLocaleString("fr-FR") : "—"),
      o.early ? "Demande expresse de commencer avant la fin du délai de rétractation : oui." : "", "Droit de rétractation : 14 jours à compter de la commande, depuis « Mes commandes » (bouton « Renoncer au contrat ici »)."];
  return lines.filter((x) => x !== undefined).join("\n");
}
async function saveText(name, text) {
  try {
    const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: new Blob([text], { type: "text/plain;charset=utf-8" }) }); return true; }
  } catch (e) {}
  try { const u = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" })); const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); return true; } catch (e) { return false; }
}
function OrdersCard({ data, src, settings }) {
  const toast = useToast();
  const orders = Object.values(data.orders || {}).filter(Boolean).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  const p = data.profile || {};
  const [wd, setWd] = useState(null); // commande en cours de rétractation
  const [form, setForm] = useState({ name: p.name || "", email: p.email || "" });
  const [busy, setBusy] = useState(false);
  if (!orders.length) return null;
  const confirm = async () => {
    setBusy(true);
    try {
      const w = { at: nowISO(), name: form.name.trim(), email: form.email.trim(), refund: refundFor(wd, data.plan, nowISO()) };
      const o = { ...wd, status: "retractee", withdrawal: w };
      await src.saveOrder(o.id, o);
      await src.setProfile({ ...p, access: accessSummary(o) });
      setWd(null);
      toast("Rétractation reçue. L'accusé de réception est téléchargé.", "ok");
      saveText("accuse-retractation-" + o.id + ".txt", orderText(o, settings, "retractation"));
    } catch (e) { toast("Envoi impossible : réessaie.", "bad"); } finally { setBusy(false); }
  };
  return html`<${Card} title="Mes commandes">
    ${orders.map((o) => html`<div key=${o.id} className="order">
      <div className="meal-h"><b>${PB[o.programId] ? PB[o.programId].n : "Programme"} · ${durName(o.weeks)}</b><${Pill} tone=${(ORDER_ST[o.status] || ORDER_ST.en_attente)[0]}>${(ORDER_ST[o.status] || ORDER_ST.en_attente)[1]}</${Pill}></div>
      <p className="muted small">Commande du ${fmtDY(String(o.at).slice(0, 10))} · ${offerName(o.offer)} · ${o.kind === "code" ? "code " + (o.code || "") : eur(Number(o.paidAmount ?? o.price) || 0)}</p>
      ${o.withdrawal ? html`<p className="small">Rétractation reçue le ${new Date(o.withdrawal.at).toLocaleString("fr-FR")} · remboursement prévu : ${eur2(o.withdrawal.refund || 0)}${o.withdrawal.refundedAt ? " (effectué le " + fmtD(o.withdrawal.refundedAt) + ")" : ""}.
        <button type="button" className="linkbtn" onClick=${() => saveText("accuse-retractation-" + o.id + ".txt", orderText(o, settings, "retractation"))}>Accusé de réception</button></p>` : null}
      <div className="btnrow"><button type="button" className="linkbtn" onClick=${() => saveText("commande-" + o.id + ".txt", orderText(o, settings, "commande"))}>Télécharger le récapitulatif</button>
        ${withdrawable(o) && (!wd || wd.id !== o.id) ? html`<button type="button" className="linkbtn" onClick=${() => { setWd(o); setForm({ name: p.name || "", email: p.email || "" }); }}>Renoncer au contrat ici</button>` : null}</div>
      ${wd && wd.id === o.id ? html`<div className="card retract"><h3>Rétractation</h3>
        <p className="small">Tu peux te rétracter jusqu'au ${fmtDY(addDays(String(o.at).slice(0, 10), 14))} inclus. Remboursement estimé : ${eur2(refundFor(o, data.plan, nowISO()))} (prorata du service déjà fourni).</p>
        <${Field} label="Nom et prénom" id="rt-n"><input id="rt-n" value=${form.name} onChange=${(e) => setForm({ ...form, name: e.target.value })} /></${Field}>
        <${Field} label="Contrat concerné"><input value=${"Commande " + o.id + " du " + fmtD(String(o.at).slice(0, 10))} readOnly /></${Field}>
        <${Field} label="E-mail pour l'accusé de réception" id="rt-e"><input id="rt-e" type="email" value=${form.email} onChange=${(e) => setForm({ ...form, email: e.target.value })} /></${Field}>
        <div className="actions"><${Btn} kind="danger" onClick=${confirm} disabled=${busy || form.name.trim().length < 2}>Confirmer la rétractation</${Btn}><${Btn} kind="quiet" onClick=${() => setWd(null)}>Annuler</${Btn}></div></div>` : null}
    </div>`)}</${Card}>`;
}

    <h3>Médiation de la consommation</h3><p>En cas de litige non résolu avec nous, tu peux saisir gratuitement le médiateur : ${v(L.mediateur)}${L.mediateurSite ? " (" + L.mediateurSite + ")" : ""}.</p>

  if (kind === "confidentialite") return html`<div className="legal small">
    <p>Version du ${fmtDY(CGV_VERSION)}. Responsable du traitement : ${L.editeur} (${L.marque}), ${v(L.adresse)}, ${contact}.</p>
    <h3>Données traitées et pourquoi</h3><ul>

      const [db, user, dl] = await Promise.all([use("db"), use("user"), use("downloads")]);
      let isOwner = false, uid = null;
      try { isOwner = user ? await user.isOwner() : false; } catch (e) {}
      try { uid = user ? await user.id() : null; } catch (e) {}
      if (alive) setBoot({ db, user, dl, isOwner, uid });
    })();
    return () => { alive = false; };
  }, []);
  if (!boot) return html`<${Splash} text="Ouverture de ton espace…" />`;
  return html`<${Shared} boot=${boot} />`;
}

  if (boot.isOwner) return html`<${CoachApp} db=${boot.db} settings=${settings.data} lib=${libItems} exo=${ex.items} dl=${boot.dl} />`;
  return html`<${ClientRoot} db=${boot.db} uid=${boot.uid} settings=${settings.data} lib=${libItems} exo=${ex.items} />`;
}
class Boundary extends React.Component {

  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { console.error(err); }
  render() {
    if (this.state.err) return html`<div className="splash"><${Logo} size=${56} /><p>Un problème d'affichage est survenu.</p><${Btn} onClick=${() => this.setState({ err: null })}>Réessayer</${Btn}></div>`;
    return this.props.children;
  }
}
const Root = window.IS_SITE && typeof SiteRoot === "function" ? SiteRoot : App;
ReactDOM.createRoot(document.getElementById("root")).render(html`<${Boundary}><${ToastHost}><${Root} /></${ToastHost}></${Boundary}>`);

</script>
