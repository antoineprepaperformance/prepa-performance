/* Concept : vestiaire de performance — fond noir chaud, or de médaille, chiffres en condensé façon tableau d'affichage. */
:root {
  color-scheme: dark;
  --bg: #0d0d0c; --surface: #161513; --surface-2: #1f1d1a; --line: #2e2b26; --grid: rgba(242, 238, 230, 0.07); --track: #2a2722;
  --fg: #f2eee6; --muted: #a49d8f; --gold: #d4ad3f; --gold-soft: rgba(212, 173, 63, 0.38); --gold-tint: rgba(212, 173, 63, 0.12);
  --btn-bg: #d4ad3f; --btn-fg: #15130f;
  --ok: #5fc08a; --warn: #e3a24c; --bad: #ea6f62; --ok-bg: rgba(95, 192, 138, 0.14); --warn-bg: rgba(227, 162, 76, 0.15); --bad-bg: rgba(234, 111, 98, 0.15);
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f5f2eb; --surface: #ffffff; --surface-2: #efe9dd; --line: #e0d7c5; --grid: rgba(23, 21, 18, 0.07); --track: #e7dfcf;
    --fg: #171512; --muted: #675f50; --gold: #8c6a12; --gold-soft: rgba(176, 137, 36, 0.35); --gold-tint: rgba(176, 137, 36, 0.12);
    --btn-bg: #c9a227; --btn-fg: #15130f;
    --ok: #217548; --warn: #9a580b; --bad: #b0352a; --ok-bg: rgba(33, 117, 72, 0.1); --warn-bg: rgba(154, 88, 11, 0.1); --bad-bg: rgba(176, 53, 42, 0.1);
    --scrim: rgba(23, 21, 18, 0.45); --shadow: 0 12px 32px rgba(40, 30, 10, 0.14);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f2eb; --surface: #ffffff; --surface-2: #efe9dd; --line: #e0d7c5; --grid: rgba(23, 21, 18, 0.07); --track: #e7dfcf;
  --fg: #171512; --muted: #675f50; --gold: #8c6a12; --gold-soft: rgba(176, 137, 36, 0.35); --gold-tint: rgba(176, 137, 36, 0.12);
  --btn-bg: #c9a227; --btn-fg: #15130f;
  --ok: #217548; --warn: #9a580b; --bad: #b0352a; --ok-bg: rgba(33, 117, 72, 0.1); --warn-bg: rgba(154, 88, 11, 0.1); --bad-bg: rgba(176, 53, 42, 0.1);
  --scrim: rgba(23, 21, 18, 0.45); --shadow: 0 12px 32px rgba(40, 30, 10, 0.14);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 30px; line-height: 1.08; }
h2 { font-size: 22px; line-height: 1.15; }
h3 { font-size: 18px; line-height: 1.2; }
p { margin: 0; }
a { color: var(--gold); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
small { font-size: 12px; }
.eyebrow { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.right { display: flex; justify-content: flex-end; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } .row4 { grid-template-columns: 1fr 1fr; } }

/* marque */
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-n { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.1; }
.brand-s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { flex: none; }
.splash { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); text-align: center; }

/* boutons & contrôles */
.btn { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 11px; padding: 11px 18px; border: 1px solid transparent; transition: transform 0.12s, background 0.15s, opacity 0.15s; min-height: 44px; }
.btn.sm { font-size: 14px; padding: 7px 12px; min-height: 36px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--gold); border-color: var(--gold-soft); }
.btn.ghost:hover:not(:disabled) { background: var(--gold-tint); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.back-l { align-self: flex-start; text-decoration: none; }
.chipbtn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; font-size: 13px; }
.chipbtn.on { border-color: var(--gold); background: var(--gold-tint); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.gold { background: var(--gold-tint); color: var(--gold); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; }
.seg button { border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 7px 12px; font-size: 14px; color: var(--muted); min-height: 36px; }
.seg button.on { background: var(--surface); color: var(--fg); border-color: var(--gold-soft); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12); }
.tabs-scroll { overflow-x: auto; }
.tabs-scroll .seg { flex-wrap: nowrap; }
.tabs-scroll .seg button { white-space: nowrap; }
.scale { display: flex; flex-direction: column; gap: 4px; }
.scale-b { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.scale-b button { min-height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.scale-b button.on { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.scale-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-l { font-size: 13px; font-weight: 600; }
.field-h { font-size: 12px; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold-tint); }
.form { display: flex; flex-direction: column; gap: 12px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 4px; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.chk input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--btn-bg); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
.copybox { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.copybox textarea { min-height: 110px; }
.search { max-width: 320px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters select { max-width: 240px; }

/* cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-h p { margin-top: 2px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 34px 16px; color: var(--muted); }
.empty h3 { color: var(--fg); }
.alert { display: flex; gap: 12px; align-items: center; justify-content: space-between; border-radius: var(--r); padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); }
.alert p { font-size: 13px; color: var(--muted); }
.alert.gold { background: var(--gold-tint); border-color: var(--gold-soft); }
.alert.warn { background: var(--warn-bg); border-color: transparent; }
.alert.warn b { color: var(--warn); }
.note { font-size: 13px; background: var(--gold-tint); border-radius: 10px; padding: 8px 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-n { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 13px; font-weight: 600; }
.stat-s { font-size: 12px; color: var(--muted); }
.stat.bad .stat-n { color: var(--bad); }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 760px) { .stats4 { grid-template-columns: 1fr 1fr; } }
.pbar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.pbar-f { height: 100%; background: var(--gold); border-radius: 999px; }
.ring { position: relative; flex: none; }
.ring svg { display: block; }
.ring-t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-t b { font-family: var(--f-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-t span { font-size: 12px; color: var(--muted); }
.ok-t { color: var(--ok); font-weight: 600; }
.warn-t { color: var(--warn); font-weight: 600; }
.bad-t { color: var(--bad); font-weight: 600; }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--bad); }
.delta small { font-weight: 500; }

/* graphiques */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.chart .ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart-val { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 20px; }
.chart-val b { color: var(--fg); font-variant-numeric: tabular-nums; }
.chart-empty { font-size: 13px; color: var(--muted); padding: 24px 0; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }

/* tableaux */
.tscroll { overflow-x: auto; margin-inline: -4px; }
.ttable, .ctable, .ptable { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.ttable th, .ttable td, .ctable th, .ctable td, .ptable th, .ptable td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ttable thead th, .ctable thead th, .ptable thead th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.ttable tbody th, .ctable tbody th, .ptable tbody th { font-weight: 600; }
.ttable small, .ctable small, .ptable small { display: block; color: var(--muted); font-weight: 400; }
.ctable tbody tr { cursor: pointer; }
.ctable tbody tr:hover { background: var(--surface-2); }
.ctable .mini { min-width: 140px; display: flex; flex-direction: column; gap: 4px; }
.ptable input { max-width: 100px; }

/* ===== espace client ===== */
.client { max-width: 580px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
.client.onboard { padding-bottom: 40px; }
.c-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 6px 14px; }
.c-main { display: block; }
.hero { display: flex; flex-direction: column; gap: 8px; padding-block: 6px 4px; }
.hero h1 { font-size: 32px; }
.hero.big h1 { font-size: 40px; }
.today-grid { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.today-grid .stat { border: 0; padding: 0; background: none; }
.next { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; background: var(--gold-tint); border: 1px solid var(--gold-soft); border-radius: var(--r); padding: 16px; }
.next-t { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.1; margin-block: 2px; }
.next-go { flex: none; background: var(--btn-bg); color: var(--btn-fg); font-family: var(--f-display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 14px; border-radius: 10px; }
.coachmsg { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.coachmsg p { margin-top: 4px; }
.srow { display: grid; grid-template-columns: 34px 1fr 24px; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.srow + .srow { margin-top: 0; }
.card .srow + .srow { margin-top: 0; }
.slist { display: flex; flex-direction: column; gap: 8px; }
.card > .srow ~ .srow { margin-top: -4px; }
.srow-id { width: 34px; height: 34px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--gold); }
.srow-t { display: flex; flex-direction: column; min-width: 0; }
.srow-t b { font-weight: 600; }
.srow-s { color: var(--muted); font-size: 20px; text-align: center; }
.srow-s.ok { color: var(--ok); font-size: 16px; font-weight: 700; }
.srow.done .srow-id { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.weeks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.wk { flex: none; min-width: 54px; display: flex; flex-direction: column; align-items: center; gap: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 8px; }
.wk span { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.wk small { color: var(--muted); font-variant-numeric: tabular-nums; }
.wk.now { border-color: var(--gold); }
.wk.on { background: var(--gold-tint); border-color: var(--gold); }
.wk.full small { color: var(--ok); }
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 580px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 20; }
.tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; color: var(--muted); font-size: 11px; font-weight: 600; min-height: 56px; }
.tabbar button.on { color: var(--gold); }
.habits { display: flex; flex-direction: column; gap: 6px; }
.habit { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.habit.on { border-color: var(--gold-soft); background: var(--gold-tint); }
.hb-box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--muted); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
.habit.on .hb-box { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.week-dots { display: flex; justify-content: space-between; gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); }
.wd-d { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); }
.checks { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.refs { font-size: 12px; color: var(--muted); padding-left: 18px; display: flex; flex-direction: column; gap: 4px; margin: 8px 0 0; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--gold); padding-block: 2px; }
details ul { margin: 8px 0 0; padding-left: 18px; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; font-weight: 600; }
.contact { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 14px; }
.contactcol { display: flex; flex-direction: column; gap: 4px; }
.hist { padding-block: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.hist:first-of-type { border-top: 0; padding-top: 0; }
.hist-h { display: flex; justify-content: space-between; }
.reply { font-size: 14px; background: var(--gold-tint); border-radius: 10px; padding: 9px 11px; }
.blocks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.blocks li { display: flex; flex-direction: column; }

.ns-A { background: #1e8f4e; } .ns-B { background: #7ab51d; } .ns-C { background: #e6b800; color: #15130f; } .ns-D { background: #e67e22; } .ns-E { background: #d6452f; }

}

/* ===== site : accueil public, connexion ===== */
.landing { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.l-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.l-top .btnrow { flex-wrap: nowrap; }
.l-hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 36px; align-items: center; padding-block: 28px 32px; }
.l-hero h1 { font-size: clamp(36px, 5.6vw, 60px); line-height: 1.02; }
.l-hero p.muted { font-size: 17px; max-width: 560px; }
.l-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.l-sec { padding-block: 28px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.l-sec h2 { font-size: 28px; }
.l-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.l-step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.l-n { font-family: var(--f-display); font-weight: 700; font-size: 30px; color: var(--gold); line-height: 1; }
.l-offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.l-offer { display: flex; flex-direction: column; gap: 8px; }
.l-prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto; }
.l-prices div { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; }
.l-prices b { font-family: var(--f-display); font-size: 21px; }
.l-prices small { color: var(--muted); }
.l-cta { align-items: flex-start; }
.l-foot { border-top: 1px solid var(--line); padding-block: 20px 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.center { text-align: center; }
@media (max-width: 860px) { .l-hero { grid-template-columns: 1fr; gap: 24px; padding-top: 16px; } .l-steps { grid-template-columns: 1fr 1fr; } .l-offers { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .l-steps { grid-template-columns: 1fr; } .l-top .brand-s, .l-top-cta { display: none; } .l-sec .pgrid.wide { grid-template-columns: 1fr 1fr; } .l-sec .pcard b { font-size: 17px; } }
.l-top .btn { white-space: nowrap; }
.side-out { margin-top: 10px; }
.coach > * { min-width: 0; }
@media (max-width: 900px) { .side-out { display: none; } .coach { grid-template-rows: auto 1fr; } }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 46px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 15px; }
.gbtn:hover { border-color: var(--gold-soft); }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sugg { display: flex; flex-direction: column; gap: 4px; }
.sugg button { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.sugg button:hover { border-color: var(--gold-soft); }
.row-end { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }

/* ===== profils de niveau, commande, codes, documents légaux ===== */
.nivs { display: flex; flex-direction: column; gap: 6px; }
.niv { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.niv:hover { border-color: var(--gold-soft); }
.niv.on { border-color: var(--gold); background: var(--gold-tint); }
.niv-h { display: flex; align-items: center; gap: 8px; }
.niv-h b { font-family: var(--f-display); font-size: 18px; }
.niv-l { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.fit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fit li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13.5px; }
.fit-i { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.fit-ok .fit-i { background: var(--ok-bg); color: var(--ok); }
.fit-info .fit-i { background: var(--gold-tint); color: var(--gold); font-style: italic; }
.fit-warn .fit-i { background: var(--warn-bg); color: var(--warn); }
.fit-bad .fit-i { background: var(--bad-bg); color: var(--bad); }
.fit-bad { color: var(--bad); }
.dose-l { margin: 6px 0 0; padding-left: 16px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.exc.prev { border-left: 3px solid var(--gold-soft); }
.prev-h { margin-bottom: 6px; }
.ready { gap: 10px; }
.srow.lock { opacity: 0.6; }
.order { display: flex; flex-direction: column; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line); }
.order:first-of-type { border-top: 0; padding-top: 0; }
.retract { margin-top: 8px; gap: 10px; border-color: var(--warn); }
.codes { display: flex; flex-direction: column; gap: 10px; }
.codeitem { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; word-break: break-all; }
.legal { display: flex; flex-direction: column; gap: 6px; line-height: 1.55; }
.legal h3 { font-size: 16px; margin-top: 8px; }
.legal ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.ok-t { color: var(--ok); }

.linktable input { min-width: 210px; width: 100%; font-size: 13px; }

"douleur","n":"Douleur","type":"scale","min":0,"max":10,"lo":"Aucune","hi":"Maximale"},{"k":"zone","n":"Où as-tu mal ?","type":"text","opt":true},{"k":"pas","n":"Pas par jour (moyenne)","type":"num","opt":true},{"k":"victoire","n":"Ta réussite de la semaine","type":"text","opt":true},{"k":"difficulte","n":"Ce qui a été difficile","type":"text","opt":true},{"k":"question","n":"Ta question pour Antoine","type":"text","opt":true}],"SCREENING":["Un médecin t'a-t-il déjà dit que tu avais un problème cardiaque ou de tension artérielle ?","Ressens-tu des douleurs dans la poitrine au repos ou pendant un effort ?","As-tu déjà perdu connaissance ou eu des vertiges importants pendant ou après un effort ?","As-tu une maladie chronique (diabète, asthme, autre) qui peut être influencée par l'activité physique ?","Prends-tu un traitement médical régulier ?","As-tu une douleur ou une blessure (os, articulation, muscle) qui pourrait s'aggraver avec l'exercice ?","As-tu été opéré(e) au cours des 12 derniers mois ou es-tu enceinte ?"],"OFFERS":[{"id":"essentiel","n":"Essentiel","desc":"Programme standardisé dans l'application, bilan hebdomadaire, réponse courte du coach chaque semaine.","prix":[49,95,135]},{"id":"suivi","n":"Suivi","desc":"Essentiel + réponse détaillée à chaque bilan, ajustements du programme et analyse vidéo d'un exercice par semaine.","prix":[99,189,269]},{"id":"hybride","n":"Hybride","desc":"Essentiel + 2 séances d'1 h par mois en présentiel avec Antoine (Bordeaux Métropole) : technique, tests et corrections sur place.","prix":[139,265,375]}],"NIV":[{"id":"reprise","n":"Reprise","short":"Débutant ou retour après une longue pause","who":"Moins de 6 mois de musculation, pas de compétition, ou reprise après plus de 3 mois d'arrêt.","what":["Une série de moins sur les exercices de musculation","Une répétition en réserve de plus (RIR + 1)","Sauts et sprints en version douce (80 à 90 % de ton maximum)","Priorité à la technique : arrête la série dès qu'une répétition se dégrade"]},{"id":"sportif","n":"Sportif","short":"Pratique régulière, loisir ou compétition départementale","who":"Entraînement régulier depuis plus de 6 mois, compétition loisir ou départementale.","what":["Le programme tel qu'Antoine l'a construit","Effort piloté par les répétitions en réserve (RIR)","Charges notées à chaque séance pour progresser"]},{"id":"perf","n":"Performance","short":"Compétiteur régional ou national","who":"Compétition régionale ou nationale, au moins 6 mois de musculation régulière.","what":["Charge cible en % de ton maximum, convertie en kg dès que ton maximum est connu","Tempo et récupération exacts pour chaque exercice","Échauffement RAMP détaillé et potentialisation avant les efforts rapides","Bloc de prévention adapté à ton sport","Contrôle de forme avant chaque séance, avec ajustement automatique","Allures calculées depuis ta VMA (course)","Affûtage la semaine de ta compétition"]},{"id":"elite","n":"Haut niveau","short":"Élite, professionnel, pôle espoir, centre de formation","who":"Niveau national élite, international, professionnel ou structure de haut niveau, avec au moins 2 ans de musculation.","what":["Tout le profil Performance","Seuil de perte de vitesse par série (capteur ou vidéo)","Séries en grappes (clusters) sur les charges lourdes","Une série de plus en semaines 2 et 3 sur la force et la puissance","Séance D optionnelle : vitesse et robustesse","Contrôle du chrono à chaque sprint"]}],"NIVQ":{"compet":{"n":"Ton niveau de pratique","o":[[0,"Pas de compétition"],[1,"Loisir ou départemental"],[2,"Régional"],[3,"National"],[4,"Élite, pro ou international"]]},"xp":{"n":"Ton expérience en musculation","o":[[0,"Jamais ou presque"],[1,"Moins de 6 mois"],[2,"6 mois à 2 ans"],[3,"Plus de 2 ans"]]},"freq":{"n":"Séances possibles par semaine, en plus de ton sport","o":[[2,"2"],[3,"3"],[4,"4 ou plus"]]}},"NIVSCI":"L'effort est piloté par les répétitions en réserve (Zourdos, 2016 ; Helms, 2016) et converti en pourcentage du maximum avec la relation répétitions–charge de la NSCA (Haff & Triplett, 2016). Au profil Haut niveau, la série s'arrête quand la vitesse de la barre chute de plus de 20 % : même gain de force avec moins de fatigue qu'à 40 % (Pareja-Blanco, 2017), et les séries en grappes maintiennent la puissance sur les charges lourdes (Tufano, 2017). L'échauffement suit la méthode RAMP (Jeffreys, 2007) et les efforts rapides sont précédés d'une potentialisation (Seitz & Haff, 2016). La prévention repose sur des protocoles validés : Nordic (moitié moins de blessures des ischios, van Dyk, 2019), Copenhague (−41 % de problèmes d'adducteurs, Harøy, 2019) et renforcement des rotateurs pour les sports de lancer (Andersson, 2017). Le contrôle de forme utilise un questionnaire de bien-être (McLean, 2010) et la détente verticale (Claudino, 2017). La semaine de compétition, le volume baisse de 40 à 60 % en gardant l'intensité (Bosquet, 2007). Les allures de course sont calculées depuis la VMA (Billat, 2001).","NIVREFS":["Zourdos MC et al. Novel resistance training-specific rating of perceived exertion scale measuring repetitions in reserve. J Strength Cond Res. 2016;30(1):267-275.","Helms ER et al. Application of the repetitions in reserve-based rating of perceived exertion scale for resistance training. Strength Cond J. 2016;38(4):42-49.","Haff GG, Triplett NT (dir.). Essentials of Strength Training and Conditioning. 4e éd. Human Kinetics / NSCA; 2016.","Pareja-Blanco F et al. Effects of velocity loss during resistance training on athletic performance, strength gains and muscle adaptations. Scand J Med Sci Sports. 2017;27(7):724-735.","Tufano JJ, Brown LE, Haff GG. Theoretical and practical aspects of different cluster set structures: a systematic review. J Strength Cond Res. 2017;31(3):848-867.","Jeffreys I. Warm-up revisited: the RAMP method of optimizing warm-ups. Professional Strength and Conditioning. 2007;(6):12-18.","Seitz LB, Haff GG. Factors modulating post-activation potentiation of jump, sp /* ===== Sources de données : base partagée, appareil, exemple ===== */
const LS_KEY = "app_local_v1";
function lsGet(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function emitter() {
  const subs = new Set();
  return { on(f) { subs.add(f); return () => subs.delete(f); }, emit(v) { subs.forEach((f) => { try { f(v); } catch (e) { console.error(e); } }); } };
}
const _queues = {};
function qwrite(path, fn) {
  const prev = _queues[path] || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  _queues[path] = p;
  return p;
}
/* ---------- cycles : un nouveau programme repart à la semaine 1 sans mélanger l'historique ---------- */
function cycOf(plan) { return Math.max(1, Number(plan && plan.cycle) || 1); }
function cpre(plan) { const c = cycOf(plan); return c > 1 ? "c" + c + "_" : ""; }
function scopeMap(m, pre) {

function scoped(raw) {

    allLogs: raw.logs || {} };
}
function emptyData() { return { profile: null, plan: null, replies: {}, logs: {}, checkins: {}, tests: {}, habits: {}, food: {}, nutri: {}, ai: {}, chat: {}, media: {}, orders: {}, ready: false }; }

/* ---------- base partagée (capability db) ---------- */
function dbSource(db, cid) {
  let raw = emptyData();
  let data = scoped(raw);
  const em = emitter();
  const unsubs = [];
  const need = { profile: 1, plan: 1, replies: 1, logs: 1, checkins: 1, tests: 1, habits: 1, food: 1, nutri: 1, ai: 1, chat: 1, media: 1, orders: 1 };
  const got = {};
  const push = (k, v) => { raw = { ...raw, [k]: v }; got[k] = 1; raw.ready = Object.keys(need).every((x) => got[x]); data = scoped(raw); em.emit(data); };
  const pre = () => cpre(raw.plan);
  const docSub = (path, k, map) => {
    try {
      unsubs.push(db.doc(path).onSnapshot((s) => push(k, map ? map(s.exists ? s.data() : null) : (s.exists ? s.data() : null)),
        () => push(k, map ? map(null) : null)));
    } catch (e) { push(k, null); }
  };
  const colSub = (path, k, query) => {
    try {
      const ref = query ? query(db.collection(path)) : db.collection(path);
      unsubs.push(ref.onSnapshot((s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = d.data(); }); push(k, o); },
        () => push(k, {})));
    } catch (e) { push(k, {}); }
  };
  const base = "clients/" + cid;
  docSub(base, "profile");
  docSub("plans/" + cid, "plan");
  docSub("replies/" + cid, "replies", (d) => d || {});
  colSub(base + "/logs", "logs"); colSub(base + "/checkins", "checkins"); colSub(base + "/tests", "tests"); colSub(base + "/habits", "habits");
  colSub(base + "/food", "food", (q) => (q.where ? q.where("d", ">=", addDays(todayISO(), -60)) : q)); colSub(base + "/nutri", "nutri"); colSub(base + "/ai", "ai"); colSub(base + "/chat", "chat"); colSub(base + "/media", "media"); colSub(base + "/orders", "orders");

  async function writeSummary(next) {
    const prof = next.profile || data.profile;
    if (!prof) return;

    await qwrite(base, () => db.doc(base).set({ ...clone(prof), sum }));
  }
  return {
    mode: "db", cid,
    get: () => data, on: (f) => em.on(f),
    close: () => unsubs.forEach((u) => { try { u(); } catch (e) {} }),
    async setProfile(p) { await qwrite(base, () => db.doc(base).set(clone(p))); },
    async saveLog(key, log, opts) {
      const k = pre() + key;
      await qwrite(base + "/logs/" + k, () => db.doc(base + "/logs/" + k).set(clone({ ...log, cycle: cycOf(raw.plan) })));
      if (!opts || !opts.noSummary) await writeSummary({ ...data, logs: { ...data.logs, [key]: log } });
    },
    async deleteLog(key) {
      const k = pre() + key;

      const logs = { ...data.logs }; delete logs[key];

    async saveCheckin(w, c, opts) {

      await qwrite(base + "/checkins/" + k, () => db.doc(base + "/checkins/" + k).set(clone(c)));
      if (!opts || !opts.noSummary) await writeSummary({ ...data, checkins: { ...data.checkins, ["w" + w]: c } });
    },
    async saveTest(id, t) { const k = pre() + id; await qwrite(base + "/tests/" + k, () => db.doc(base + "/tests/" + k).set(clone(t))); },
    async saveOrder(id, o) { await qwrite(base + "/orders/" + id, () => db.doc(base + "/orders/" + id).set(clone(o))); },
    async saveHabits(month, h) { await qwrite(base + "/habits/" + month, () => db.doc(base + "/habits/" + month).set(clone(h))); },
    async setPlan(p) { await qwrite("plans/" + cid, () => db.doc("plans/" + cid).set(clone(p))); },
    async saveNutri(p) { await qwrite(base + "/nutri/plan", () => db.doc(base + "/nutri/plan").set(clone(p))); },
    async saveFood(date, doc) { await qwrite(base + "/food/" + date, () => db.doc(base + "/food/" + date).set(clone({ ...doc, d: date }))); },
    async saveMedia(id, doc) { await qwrite(base + "/media/" + id, () => (doc ? db.doc(base + "/media/" + id).set(clone(doc)) : db.doc(base + "/media/" + id).delete())); },
    async saveAdjust(id, a) {
      await qwrite(base + "/ai/" + id, () => db.doc(base + "/ai/" + id).set(clone(a)));

    },
    async saveChat(month, doc) { await qwrite(base + "/chat/" + month, () => db.doc(base + "/chat/" + month).set(clone(doc))); },
    async setReply(w, text) {
      const next = { ...(raw.replies || {}), [pre() + "w" + w]: { text, at: nowISO() } };
      await qwrite("replies/" + cid, () => db.doc("replies/" + cid).set(next));
    },
    async refreshSummary() { await writeSummary(data); },
  };

/* ---------- import d'un envoi client (côté coach) ---------- */
async function importPackage(db, text) {
  const raw = String(text || "").trim();
  const m = raw.match(/APP1\.([A-Za-z0-9+/=]+)/);
  if (!m) throw new Error("Ce texte ne contient pas d'envoi client. Il commence normalement par « APP1. ».");
  const pkg = b64dec(m[1]);
  if (!pkg || pkg.kind !== "client") throw new Error("Envoi illisible.");
  const cid = pkg.cid || rid("m_");
  const base = "clients/" + cid;
  const prev = await db.doc(base).get();
  const prof = { ...(prev.exists ? prev.data() : {}), ...(pkg.profile || {}), local: true };
  const all = { logs: pkg.logs || {}, checkins: pkg.checkins || {}, tests: pkg.tests || {}, habits: pkg.habits || {} };
  const extra = { food: pkg.food || {}, nutri: pkg.nutri || {}, ai: pkg.ai || {}, chat: pkg.chat || {} };
  for (const [k, v] of Object.entries(all.logs)) await dbSet(db, base + "/logs/" + k, v);
  for (const [k, v] of Object.entries(all.checkins)) await dbSet(db, base + "/checkins/" + k, v);
  for (const [k, v] of Object.entries(all.tests)) await dbSet(db, base + "/tests/" + k, v);
  for (const [k, v] of Object.entries(all.habits)) await dbSet(db, base + "/habits/" + k, v);
  for (const sub of ["food", "nutri", "chat"]) for (const [k, v] of Object.entries(extra[sub])) if (v) await dbSet(db, base + "/" + sub + "/" + k, v);
  for (const [k, v] of Object.entries(extra.ai)) {
    if (!v) continue;
    let prev = null;
    try { const s = await db.doc(base + "/ai/" + k).get(); prev = s.exists ? s.data() : null; } catch (e) {}
    const merged = prev ? { ...v, seen: !!(prev.seen || v.seen), status: prev.status === "annule" ? "annule" : v.status } : v;
    extra.ai[k] = merged;
    await dbSet(db, base + "/ai/" + k, merged);
  }
  Object.assign(all, { ai: extra.ai });
  prof.sum = summarize(all);
  prof.importedAt = nowISO();
  await dbSet(db, base, prof);
  return { cid, name: prof.name || "Client", counts: Object.fromEntries(Object.entries(all).map(([k, v]) => [k, Object.keys(v).length])) };
}
function accessCode({ cid, profile, plan, lib, exo, coach, replies, ai, aiData }) {
  const libOut = {};
  if (plan && lib) {
    if (lib[plan.programId]) libOut[plan.programId] = lib[plan.programId];
    (plan.extra || []).forEach((x) => { if (lib[x.sid]) libOut[x.sid] = lib[x.sid]; });
  }
  const aiSeen = aiData ? Object.fromEntries(Object.entries(aiData).filter(([, a]) => a && (a.seen || a.status === "annule")).map(([k, a]) => [k, { seen: !!a.seen, status: a.status }])) : null;
  return "APPCODE1." + b64enc({ v: 1, kind: "code", cid, name: profile && profile.name || "", plan, lib: libOut, exo: exo || {}, coach, replies: replies || {}, ai: ai || null, aiSeen });
}
function readCode(text) {
  const m = String(text || "").trim().match(/APPCODE1\.([A-Za-z0-9+/=]+)/);
  if (!m) throw new Error("Ce texte ne contient pas de code d'accès. Il commence par « APPCODE1. ».");
  const c = b64dec(m[1]);
  if (!c || c.kind !== "code") throw new Error("Code d'accès illisible.");

function Field({ label, hint, children, id }) {

function Modal({ open, title, onClose, children, wide }) {

const ToastCtx = React.createContext(() => {});
function ToastHost({ children }) {
  const [items, setItems] = useState([]);

    setItems([{ id, text, tone }]); /* un seul message à la fois */
    setTimeout(() => setItems((x) => x.filter((i) => i.id !== id)), tone === "bad" || tone === "warn" ? 4500 : 2600);
  }, []);
  return html`<${ToastCtx.Provider} value=${push}>${children}<div className="toasts" aria-live="polite">${items.map((i) => html`<div key=${i.id} className=${"toast " + (i.tone || "")}>${i.text}</div>`)}</div></${ToastCtx.Provider}>`;

const useToast = () => React.useContext(ToastCtx);

function CopyBox({ text, label, id }) {
  const toast = useToast();
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  const copy = () => {
    try {
      navigator.clipboard.writeText(text).then(() => toast("Copié. Colle-le dans un message.", "ok"), () => { setShown(true); setTimeout(() => ref.current && ref.current.select(), 30); });
    } catch (e) { setShown(true); setTimeout(() => ref.current && ref.current.select(), 30); }
  };
  return html`<div className="copybox">
    <${Btn} onClick=${copy}>${label || "Copier"}</${Btn}>
    <button type="button" className="linkbtn" onClick=${() => { setShown(!shown); setTimeout(() => ref.current && ref.current.select(), 30); }}>${shown ? "Masquer le texte" : "Afficher le texte"}</button>
    ${shown ? html`<textarea id=${id || "copy-" + label} ref=${ref} readOnly className="code" value=${text} onFocus=${(e) => e.target.select()}></textarea>` : null}
  </div>`;

function useWidth(ref, fallback) {
  const [w, setW] = useState(fallback || 320);
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current;
    const set = () => setW(Math.max(200, Math.round(el.getBoundingClientRect().width)));
    set();
    let ro = null;
    try { ro = new ResizeObserver(set); ro.observe(el); } catch (e) { window.addEventListener("resize", set); }
    return () => { try { ro && ro.disconnect(); } catch (e) {} window.removeEventListener("resize", set); };
  }, []);
  return w;
}

function niceTicks(min, max, n) {
  const span = max - min || 1;
  const step0 = span / (n || 3);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 1000) / 1000);
  return t;
}

function LineChart({ points, unit, height, digits, zeroBased }) {
  const ref = useRef(null);
  const W = useWidth(ref);
  const H = height || 170;
  const [hover, setHover] = useState(null);
  const gid = useMemo(() => rid("g"), []);
  const has = points && points.length > 0;
  let body = null, label = null;
  if (has) {
    const ys = points.map((p) => p.y);
    let mn = Math.min(...ys), mx = Math.max(...ys);
    if (zeroBased) mn = Math.min(0, mn);
    if (mn === mx) { mn -= 1; mx += 1; }
    const ticks = niceTicks(mn, mx, 3);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const L = 40, R = 14, Tp = 16, B = 24;
    const x = (i) => points.length === 1 ? (L + (W - L - R) / 2) : L + (i * (W - L - R)) / (points.length - 1);
    const y = (v) => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo || 1));
    const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.y).toFixed(1)).join(" ");
    const area = d + " L" + x(points.length - 1).toFixed(1) + " " + (H - B) + " L" + x(0).toFixed(1) + " " + (H - B) + " Z";
    const every = Math.ceil(points.length / Math.max(2, Math.floor((W - L - R) / 46)));
    const last = points.length - 1;
    const hi2 = hover !== null && hover < points.length ? hover : null;
    const onMove = (cx, el) => {
      const r = el.getBoundingClientRect();
      const px = cx - r.left;
      let best = 0, bd = 1e9;
      points.forEach((p, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; best = i; } });
      setHover(best);
    };
    body = html`<svg width=${W} height=${H} onMouseMove=${(e) => onMove(e.clientX, e.currentTarget)} onMouseLeave=${() => setHover(null)}
      onTouchStart=${(e) => e.touches[0] && onMove(e.touches[0].clientX, e.currentTarget)} role="img" aria-label=${"Courbe : " + points.map((p) => p.x + " " + fmtN(p.y, digits)).join(", ")}>
      <defs><linearGradient id=${gid} x1="0" x2="0" y1="0" y2="1"><stop offset="0" style=${{ stopColor: "var(--gold)", stopOpacity: 0.28 }}></stop><stop offset="1" style=${{ stopColor: "var(--gold)", stopOpacity: 0 }}></stop></linearGradient></defs>
      ${ticks.map((t) => html`<g key=${"t" + t}><line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} style=${{ stroke: "var(--grid)", strokeWidth: 1 }}></line>
        <text x=${L - 6} y=${y(t) + 4} textAnchor="end" className="ax">${fmtN(t, digits ?? 1)}</text></g>`)}
      ${points.map((p, i) => (i % every === 0 || i === last) ? html`<text key=${"x" + i} x=${x(i)} y=${H - 6} textAnchor="middle" className="ax">${p.x}</text>` : null)}
      <path d=${area} style=${{ fill: "url(#" + gid + ")" }}></path>
      <path d=${d} style=${{ fill: "none", stroke: "var(--gold)", strokeWidth: 2, strokeLinejoin: "round", strokeLinecap: "round" }}></path>
      ${hi2 !== null ? html`<line x1=${x(hi2)} x2=${x(hi2)} y1=${Tp} y2=${H - B} style=${{ stroke: "var(--muted)", strokeWidth: 1, strokeDasharray: "3 3" }}></line>` : null}
      ${points.map((p, i) => html`<circle key=${"c" + i} cx=${x(i)} cy=${y(p.y)} r=${i === last || i === hi2 ? 5 : 3.2} style=${{ fill: i === last ? "var(--gold)" : "var(--surface)", stroke: "var(--gold)", strokeWidth: 2 }}></circle>`)}
    </svg>`;
    const hv = hi2 !== null ? points[hi2] : points[last];
    label = html`<div className="chart-val"><b>${fmtN(hv.y, digits)} ${unit || ""}</b> · ${hv.x}</div>`;
  }
  return html`<div ref=${ref} className="chart">${has ? html`${body}${label}` : html`<div className="chart-empty">Pas encore de données</div>`}</div>`;
}

function BarChart({ data, unit, height, target, digits, fmt }) {

  const mx = Math.max(target || 0, ...data.map((d) => d.y), 1);
  const ticks = niceTicks(0, mx, 3);
  const hi = ticks[ticks.length - 1];
  const L = 36, R = 8, Tp = 10, B = 22;
  const bw = (W - L - R) / data.length;
  const y = (v) => Tp + (H - Tp - B) * (1 - v / (hi || 1));
  const every = Math.ceil(data.length / Math.max(2, Math.floor((W - L - R) / 30)));
  const hv = hover !== null ? data[hover] : null;
  return html`<div ref=${ref} className="chart">
    <svg width=${W} height=${H} role="img" aria-label=${"Barres : " + data.map((d) => d.x + " " + fmtN(d.y, digits)).join(", ")} onMouseLeave=${() => setHover(null)}>
      ${ticks.map((t) => html`<g key=${"t" + t}><line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} style=${{ stroke: "var(--grid)", strokeWidth: 1 }}></line>
        <text x=${L - 6} y=${y(t) + 4} textAnchor="end" className="ax">${fmt ? fmt(t) : fmtN(t, 0)}</text></g>`)}
      ${data.map((d, i) => {
        const h = Math.max(0, (H - B) - y(d.y));
        const bx = L + i * bw + 2, w = Math.max(2, bw - 4);
        return html`<g key=${"b" + i} onMouseEnter=${() => setHover(i)} onTouchStart=${() => setHover(i)}>
          <rect x=${L + i * bw} y=${Tp} width=${bw} height=${H - Tp - B} style=${{ fill: "transparent" }}></rect>
          ${h > 0 ? html`<path d=${"M" + bx + " " + (H - B) + " V" + (H - B - h + Math.min(4, h)) + " Q" + bx + " " + (H - B - h) + " " + (bx + Math.min(4, w / 2)) + " " + (H - B - h) + " H" + (bx + w - Math.min(4, w / 2)) + " Q" + (bx + w) + " " + (H - B - h) + " " + (bx + w) + " " + (H - B - h + Math.min(4, h)) + " V" + (H - B) + " Z"}
            style=${{ fill: d.muted ? "var(--gold-soft)" : "var(--gold)", opacity: hover === null || hover === i ? 1 : 0.55 }}></path>` : null}
          ${(i % every === 0 || i === data.length - 1) ? html`<text x=${L + i * bw + bw / 2} y=${H - 6} textAnchor="middle" className="ax">${d.x}</text>` : null}
        </g>`;
      })}
      ${target ? html`<line x1=${L} x2=${W - R} y1=${y(target)} y2=${y(target)} style=${{ stroke: "var(--fg)", strokeWidth: 1, strokeDasharray: "4 4", opacity: 0.5 }}></line>` : null}
      <line x1=${L} x2=${W - R} y1=${H - B} y2=${H - B} style=${{ stroke: "var(--line)", strokeWidth: 1 }}></line>
    </svg>
    <div className="chart-val">${hv ? html`<b>${fmt ? fmt(hv.y) : fmtN(hv.y, digits)} ${unit || ""}</b> · ${hv.x}${hv.note ? " · " + hv.note : ""}` : html`<span className="muted">Survole ou touche une barre</span>`}</div>
  </div>`;
}

function Ring({ value, size, label, sub }) {
  const s = size || 120, r = s / 2 - 9, c = 2 * Math.PI * r;
  const v = value === null || value === undefined ? null : clamp(value, 0, 1);
  return html`<div className="ring" style=${{ width: s + "px" }}>
    <svg width=${s} height=${s} viewBox=${"0 0 " + s + " " + s} role="img" aria-label=${(label || "") + " " + (sub || "")}>
      <circle cx=${s / 2} cy=${s / 2} r=${r} style=${{ fill: "none", stroke: "var(--track)", strokeWidth: 9 }}></circle>
      ${v !== null ? html`<circle cx=${s / 2} cy=${s / 2} r=${r} transform=${"rotate(-90 " + s / 2 + " " + s / 2 + ")"} style=${{ fill: "none", stroke: "var(--gold)", strokeWidth: 9, strokeLinecap: "round", strokeDasharray: c, strokeDashoffset: c * (1 - v) }}></circle>` : null}
    </svg>
    <div className="ring-t"><b>${label}</b>${sub ? html`<span>${sub}</span>` : null}</div>
  </div>`;
}
function Bar({ value, tone }) { return html`<div className="pbar"><div className=${"pbar-f " + (tone || "")} style=${{ width: clamp((value || 0) * 100, 0, 100) + "%" }}></div></div>`; }
function Stat({ n, label, sub, tone }) { return html`<div className=${"stat " + (tone || "")}><div className="stat-n">${n}</div><div className="stat-l">${label}</div>${sub ? html`<div className="stat-s">${sub}</div>` : null}</div>`; }
function Delta({ a, b, better, unit, digits }) {
  if (a === null || b === null || a === undefined || b === undefined) return null;
  const d = b - a;
  if (Math.abs(d) < 1e-9) return html`<span className="delta">=</span>`;
  const good = better === "low" ? d < 0 : better === "high" ? d > 0 : null;
  const pct = a ? Math.round((d / Math.abs(a)) * 1000) / 10 : null;
  return html`<span className=${"delta " + (good === true ? "up" : good === false ? "down" : "")}>${d > 0 ? "+" : "−"}${fmtN(Math.abs(d), digits ?? 2)} ${unit || ""}${pct !== null ? html` <small>(${d > 0 ? "+" : "−"}${fmtN(Math.abs(pct), 1)} %)</small>` : null}</span>`;
}

/* ---------- racine client : choisit la source ---------- */
function ClientRoot({ db, uid, settings, lib, exo }) {
  const [st, setSt] = useState({ phase: "detect" });
  const toast = useToast();
  useEffect(() => {
    let alive = true;
    (async () => {
      const local = window.IS_SITE ? null : lsGet(LS_KEY);
      if (db && uid) {
        try {
          const snap = await db.doc("clients/" + uid).get();
          if (!alive) return;
          if (snap.exists) { setSt({ phase: "app", src: dbSource(db, uid) }); return; }
        } catch (e) {
          /* lecture refusée : sur claude.ai on bascule sur l'appareil ; sur le site on affiche l'erreur */
          if (window.IS_SITE) { if (alive) setSt({ phase: "error", msg: e && e.code === "unavailable" ? "Pas de connexion internet." : "Lecture de ton espace impossible." }); return; }
        }
      }
      if (!alive) return;
      if (local && local.profile) { setSt({ phase: "app", src: localSource() }); return; }
      setSt({ phase: "onboard", canDb: !!(db && uid) });
    })();
    return () => { alive = false; };
  }, [db, uid]);
  useEffect(() => () => { if (st.src) st.src.close(); }, [st.src]);

  async function submit(profile) {
    if (st.canDb) {
      try {
        await db.doc("clients/" + uid).set(clone(profile));
        setSt({ phase: "app", src: dbSource(db, uid) });
        return;
      } catch (e) {
        if (window.IS_SITE) throw new Error("vérifie ta connexion internet et réessaie");
        toast("Mode sans compte : tes données restent sur ce téléphone. Envoie ta demande à ton coach ci-dessous.", "warn");
      }
    }
    if (window.IS_SITE) throw new Error("connexion au serveur impossible");
    const ls = localSource({ ...emptyData(), cid: null });
    await ls.setProfile(profile);
    setSt({ phase: "app", src: ls });
  }
  function applyAccessCode(text) {
    const code = readCode(text);
    const ls = localSource({ ...emptyData(), cid: code.cid });
    ls.applyCode(code);
    setSt({ phase: "app", src: ls });
  }
  if (st.phase === "detect") return html`<${Splash} text="Chargement de ton espace…" />`;
  if (st.phase === "error") return html`<div className="splash"><${Logo} size=${56} /><p>${st.msg}</p><div className="btnrow"><${Btn} onClick=${() => location.reload()}>Réessayer</${Btn}><${SignOutLink} /></div></div>`;
  if (st.phase === "onboard") return html`<${Onboarding} settings=${settings} onSubmit=${submit} onCode=${applyAccessCode} />`;
  return html`<${ClientApp} src=${st.src} settings=${settings} lib=${lib} exo=${exo} db=${db} uid=${uid} />`;
}

  const nextB = html`${next ? html`<button type="button" className="next" onClick=${() => openSession(next)}>
      <div><div className="eyebrow">Séance ${next.extra ? "supplémentaire" : next.sid}${next.opt ? " · optionnelle" : ""}${next.s.lieu ? " · " + next.s.lieu : ""}</div>

  const alerts = html`${testDue ? html`<div className="alert gold"><div><b>Semaine de tests</b><p>Fais tes tests en fin de semaine et note tes résultats.</p></div><${Btn} small onClick=${() => openTests(testPoint)}>Saisir</${Btn}></div>` : null}
    ${prevMissing ? html`<div className="alert warn"><div><b>Bilan de la semaine ${w - 1} en attente</b><p>Deux minutes pour dire à ton coach comment ça s'est passé.</p></div><${Btn} small onClick=${() => go("bilan")}>Remplir</${Btn}></div>` : null}
    ${!ck && (ps.day >= 6 || !next) ? html`<div className="alert gold"><div><b>Bilan de la semaine ${w}</b><p>À remplir en fin de semaine.</p></div><${Btn} small onClick=${() => go("bilan")}>Remplir</${Btn}></div>` : null}
    ${left <= 7 && onRenew ? html`<div className="alert gold"><div><b>Ton accès se termine le ${fmtD(ps.end)}</b><p>Prolonge maintenant pour enchaîner sans coupure.</p></div><${Btn} small onClick=${onRenew}>Prolonger</${Btn}></div>` : null}
    ${hold}`;
  const ainotes = html`<${AINotes} data=${data} w=${w} openChat=${openChat} />`;
  const cardMini = html`<${CardPanel} data=${data} plan=${plan} prog=${prog} lib=${lib} compact=${true} onOpen=${() => go("profil")} />`;
  const nutri = html`<${NutriToday} data=${data} go=${go} />`;
  const habits = prog.habits && prog.habits.length ? html`<${Habits} prog=${prog} data=${data} src=${src} block=${ps.block} />` : null;
  const msgs = html`${plan.message ? html`<${CoachMsg} text=${plan.message} coach=${coach} />` : null}
    ${lastReply ? html`<${CoachMsg} text=${lastReply.text} coach=${coach} title=${"Réponse à ton bilan de la semaine " + lastReply.w} />` : null}`;
  const week = html`<${Card} title=${"Semaine " + w}>${sessions.map((e) => html`<${SessionRow} key=${e.key} e=${e} log=${data.logs[e.key]} onOpen=${() => openSession(e)} />`)}</${Card}>`;
  if (wide) return html`<div className="stack">${hero}<div className="cols2"><div className="stack">${nextB}${alerts}${week}${msgs}</div><div className="stack">${ring}${cardMini}${ainotes}${nutri}${habits}</div></div></div>`;
  return html`<div className="stack">${hero}${ring}${nextB}${alerts}${ainotes}${cardMini}${nutri}${habits}${msgs}${week}</div>`;
}

/* ---------- Habitudes ---------- */
function Habits({ prog, data, src, block }) {
  const today = todayISO();
  const m = today.slice(0, 7);
  const doc = data.habits[m] || { days: {} };
  const done = (doc.days && doc.days[today]) || [];
  const [busy, setBusy] = useState(false);
  const toggle = async (i) => {
    if (busy) return;
    setBusy(true);
    const set = new Set(done); set.has(i) ? set.delete(i) : set.add(i);
    const next = { ...doc, days: { ...(doc.days || {}), [today]: [...set].sort() } };
    try { await src.saveHabits(m, next); } finally { setBusy(false); }
  };
  const last7 = Array.from({ length: 7 }, (_, k) => addDays(today, k - 6));
  const score = (d) => { const mm = d.slice(0, 7); const dd = data.habits[mm] && data.habits[mm].days && data.habits[mm].days[d]; return dd ? dd.length / prog.habits.length : 0; };
  return html`<${Card} title="Mes habitudes du jour" sub=${prog.habit_note ? prog.habit_note[Math.min(block, prog.habit_note.length) - 1] : null}>
    <div className="habits">${prog.habits.map((h, i) => html`<button key=${i} type="button" className=${"habit" + (done.includes(i) ? " on" : "")} aria-pressed=${done.includes(i)} onClick=${() => toggle(i)}>
      <span className="hb-box">${done.includes(i) ? "✓" : ""}</span><span>${h}</span></button>`)}</div>
    <div className="week-dots">${last7.map((d) => html`<div key=${d} className="wd"><span className="wd-d" style=${{ opacity: 0.25 + 0.75 * score(d) }}></span><small>${JOURS[parseISO(d).getDay()].slice(0, 1).toUpperCase()}</small></div>`)}</div>
  </${Card}>`;
}

/* ---------- Lecteur de séance ---------- */
function prevSets(data, e, excludeKey) {
  const logs = Object.values(data.logs || {}).filter((l) => l && l.key !== excludeKey).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  for (const l of logs) { const it = (l.items || []).find((x) => x.e === e && x.sets && x.sets.some((s) => num(s.kg) !== null)); if (it) return { sets: it.sets, date: l.date }; }
  return null;
}
function SessionPlayer({ entry, prog, plan, exo, data, src, onClose, isCurrent }) {
  const toast = useToast();
  const wib = ((entry.w - 1) % 4) + 1;
  const existing = data.logs[entry.key];
  const niv = effNiveau(plan, data.profile);
  const detailed = nivRank(niv) >= 2;
  const items = useMemo(() => [...entry.s.items, ...preventionFor(entry, prog, plan, niv, data.profile && data.profile.sport)], [entry.key, niv]);
  const [ready, setReady] = useState(existing && existing.readiness ? existing.readiness.values : null);
  const rd = detailed ? readinessOf(ready, data) : null;
  const taper = detailed ? taperFor(plan, entry.w) : null;
  const ctx = useMemo(() => ({ niveau: niv, block: Math.ceil(entry.w / 4), e1rm: (e) => e1rmFor(e, data), vma: vmaOf(data), t5k: t5kOf(data), taper, ready: rd }), [niv, entry.key, rd && rd.lvl, !!taper]);
  const doses = useMemo(() => items.map((it) => doseFor(it, wib, ctx)), [items, ctx]);
  const [vals, setVals] = useState(() => items.map((it, i) => {
    const d = doseFor(it, wib, { niveau: niv, block: Math.ceil(entry.w / 4) });
    const ex = existing && existing.items && existing.items[i];
    if (d.load) {
      const prev = prevSets(data, it.e, entry.key);
      const n = Math.max(1, d.sets || 1);
      const target = parseInt(String(d.reps), 10) || "";
      return { e: it.e, sets: Array.from({ length: Math.max(n, ex && ex.sets ? ex.sets.length : 0) }, (_, k) => ex && ex.sets && ex.sets[k] ? { ...ex.sets[k] } : { kg: prev && prev.sets[Math.min(k, prev.sets.length - 1)] ? prev.sets[Math.min(k, prev.sets.length - 1)].kg : "", reps: target }), prev };
    }
    return { e: it.e, done: ex ? !!ex.done : false };
  }));
  /* la forme du jour ou l'affûtage changent le nombre de séries : on ajuste les lignes sans perdre la saisie */
  useEffect(() => {
    if (existing) return;
    setVals((vs) => vs.map((v, i) => {
      if (!v.sets) return v;
      const n = Math.max(1, doses[i].sets || 1);
      if (v.sets.length === n) return v;
      const filled = v.sets.filter((s) => s.kg !== "" && s.kg !== null && s.kg !== undefined && !(v.prev && v.prev.sets.some((p) => p.kg === s.kg))).length;
      if (v.sets.length > n) return { ...v, sets: v.sets.slice(0, Math.max(n, filled)) };
      const last = v.sets[v.sets.length - 1] || { kg: "", reps: "" };
      return { ...v, sets: [...v.sets, ...Array.from({ length: n - v.sets.length }, () => ({ ...last }))] };
    }));
  }, [doses]);
  const [rpe, setRpe] = useState(existing ? existing.rpe : null);
  const [duree, setDuree] = useState(existing ? existing.duree : 60);
  const [douleur, setDouleur] = useState(existing ? existing.douleur || 0 : 0);
  const [zone, setZone] = useState(existing ? existing.zone || "" : "");
  const [comment, setComment] = useState(existing ? existing.comment || "" : "");
  const [date, setDate] = useState(existing ? existing.date : (isCurrent ? todayISO() : addDays(plan.start, (entry.w - 1) * 7)));
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const upd = (i, f) => setVals((v) => v.map((x, k) => (k === i ? f(clone(x)) : x)));
  const save = async () => {
    if (rpe === null || rpe === undefined) { toast("Indique ton effort ressenti (0 à 10) avant d'enregistrer.", "warn"); return; }
    setBusy(true);
    const log = { key: entry.key, w: entry.w, sid: entry.sid, date, title: entry.s.t, items: vals.map((v, i) => ({ e: v.e, done: v.sets ? true : !!v.done, sets: v.sets ? v.sets.map((s) => ({ kg: num(s.kg), reps: num(s.reps) })) : undefined, prev: items[i] && items[i].prev ? true : undefined })),
      rpe, duree: num(duree) || 0, load: (rpe || 0) * (num(duree) || 0), douleur, zone: douleur > 0 ? zone : "", comment, savedAt: nowISO(), niveau: niv,
      readiness: rd ? { values: ready, score: rd.score, lvl: rd.lvl } : undefined, opt: entry.opt ? true : undefined };
    try { await src.saveLog(entry.key, log); toast("Séance enregistrée.", "ok"); onClose(); }
    catch (e) { toast("Enregistrement impossible. Réessaie dans un instant.", "bad"); }
    finally { setBusy(false); }
  };
  const del = async () => { setBusy(true); try { await src.deleteLog(entry.key); toast("Séance supprimée.", "ok"); onClose(); } finally { setBusy(false); } };
  const wu = warmupFor(entry, prog, plan, niv);
  const nPrev = items.filter((x) => x.prev).length;
  return html`<div className="player">
    <header className="p-top"><button type="button" className="back" onClick=${onClose} aria-label="Retour">‹</button>
      <div><div className="eyebrow">Semaine ${entry.w} · séance ${entry.extra ? "supplémentaire" : entry.sid}${entry.opt ? " (optionnelle)" : ""}${entry.s.lieu ? " · " + entry.s.lieu : ""} · profil ${nivName(niv)}</div><h2>${entry.s.t}</h2></div></header>
    ${entry.s.focus ? html`<p className="muted">${entry.s.focus}</p>` : null}
    ${plan.medicalHold ? html`<div className="alert warn"><div><b>Mode Reprise</b><p>En attendant l'avis de ton médecin, les charges et les intensités sont réduites.</p></div></div>` : null}
    ${taper ? html`<div className="alert gold"><div><b>Affûtage</b><p>${taper.n}</p></div></div>` : null}
    ${detailed ? html`<${ReadinessCheck} value=${ready} onChange=${setReady} data=${data} />` : null}
    ${wu ? html`<div className="wu"><b>${detailed ? "Échauffement RAMP" : "Échauffement"}</b><p>${wu}</p></div>` : null}
    <ol className="exlist">${items.map((it, i) => {
      const ex = exOf(it.e, plan.equipment, prog, exo);
      const d = doses[i];
      const v = vals[i];
      return html`<li key=${i} className=${"exc" + (it.prev ? " prev" : "")}>
        ${it.prev && (i === 0 || !items[i - 1].prev) ? html`<div className="eyebrow prev-h">Prévention · ${plural(nPrev, "exercice")} adapté${nPrev > 1 ? "s" : ""} à ton sport</div>` : null}
        <div className="exc-h"><span className="exc-n">${i + 1}</span><div className="exc-t"><b>${ex.n}</b>${ex.subst ? html` <${Pill} tone="gold">version maison</${Pill}>` : null}
          <div className="dose">${d.text}</div>${(d.lines || []).length ? html`<ul className="dose-l">${d.lines.map((l, k) => html`<li key=${k}>${l}</li>`)}</ul>` : null}
          ${it.n ? html`<div className="muted small">${it.n}</div>` : null}${ex.cnote ? html`<div className="muted small">${ex.cnote}</div>` : null}
          ${it.adj ? html`<div className="ai-note">✦ ${it.adj}</div>` : null}${it.adjNote ? html`<div className="ai-note">✦ Consigne du coach IA : ${it.adjNote}</div>` : null}</div></div>
        <details className="cues"><summary>Consignes${ex.video ? " et vidéo" : ""}</summary>
          <ul>${(ex.cues || []).map((c, k) => html`<li key=${k}>${c}</li>`)}</ul>
          ${ex.reg || ex.prog ? html`<p className="small muted">${ex.reg ? "Plus facile : " + ex.reg + ". " : ""}${ex.prog ? "Plus difficile : " + ex.prog + "." : ""}</p>` : null}
          ${ex.video ? html`<a href=${ex.video} target="_blank" rel="noopener">Voir la démonstration</a>` : null}
        </details>
        ${v && v.sets ? html`<div className="sets">
          <div className="sets-h"><span>Série</span><span>Charge (kg)</span><span>Rép.</span></div>
          ${v.sets.map((s, k) => html`<div className="set" key=${k}><span className="set-n">${k + 1}</span>
            <input id=${"kg-" + i + "-" + k} inputMode="decimal" aria-label=${"Charge série " + (k + 1)} value=${s.kg ?? ""} placeholder=${d.kg ? fmtN(d.kg[0], 1) : ""} onChange=${(e) => upd(i, (x) => { x.sets[k].kg = e.target.value; return x; })} />
            <input id=${"rp-" + i + "-" + k} inputMode="numeric" aria-label=${"Répétitions série " + (k + 1)} value=${s.reps ?? ""} onChange=${(e) => upd(i, (x) => { x.sets[k].reps = e.target.value; return x; })} /></div>`)}
          <div className="sets-f">${v.prev ? html`<span className="muted small">Dernière fois (${fmtD(v.prev.date)}) : ${v.prev.sets.map((s) => (s.kg ?? "—") + " kg × " + (s.reps ?? "—")).join(" · ")}</span>` : html`<span className="muted small">Note la charge utilisée à chaque série.</span>`}
            <button type="button" className="linkbtn" onClick=${() => upd(i, (x) => { x.sets.push({ ...(x.sets[x.sets.length - 1] || { kg: "", reps: "" }) }); return x; })}>+ série</button></div>
        </div>` : v ? html`<button type="button" className=${"donebtn" + (v.done ? " on" : "")} aria-pressed=${!!v.done} onClick=${() => upd(i, (x) => { x.done = !x.done; return x; })}>${v.done ? "✓ Fait" : "Marquer comme fait"}</button>` : null}
      </li>`;
    })}</ol>
    <section className="card finish">
      <h3>Fin de séance</h3>
      <${Field} label="Effort ressenti (0 à 10)" hint=${rpe !== null && rpe !== undefined ? RPE_LABELS[rpe] : "0 = repos, 10 = maximal"}><${Scale} id="rpe" min=${0} max=${10} value=${rpe} onChange=${setRpe} /></${Field}>
      <div className="row2">
        <${Field} label="Durée (minutes)" id="duree"><input id="duree" inputMode="numeric" value=${duree} onChange=${(e) => setDuree(e.target.value)} /></${Field}>
        <${Field} label="Date" id="date"><input id="date" type="date" value=${date} onChange=${(e) => setDate(e.target.value)} /></${Field}>
      </div>
      ${detailed ? html`<p className="muted small">Charge de la séance (effort × durée, Foster 2001) : ${rpe !== null && rpe !== undefined ? fmtN(rpe * (num(duree) || 0), 0) + " UA" : "—"}.</p>` : null}
      <${Field} label="Douleur pendant ou après (0 à 10)" hint="Au-dessus de 3 : allège et préviens ton coach."><${Scale} id="douleur" min=${0} max=${10} value=${douleur} onChange=${setDouleur} /></${Field}>
      ${douleur > 0 ? html`<${Field} label="Où ?" id="zone"><input id="zone" value=${zone} onChange=${(e) => setZone(e.target.value)} placeholder="Ex. genou gauche" /></${Field}>` : null}
      <${Field} label="Commentaire (facultatif)" id="comment"><textarea id="comment" rows="3" value=${comment} onChange=${(e) => setComment(e.target.value)}></textarea></${Field}>
      <div className="actions"><${Btn} block onClick=${save} disabled=${busy}>${existing ? "Mettre à jour la séance" : "Enregistrer la séance"}</${Btn}></div>
      ${existing ? html`<div className="actions">${confirmDel ? html`<span className="small">Supprimer cette séance ?</span><${Btn} kind="danger" small onClick=${del} disabled=${busy}>Oui, supprimer</${Btn}><${Btn} kind="quiet" small onClick=${() => setConfirmDel(false)}>Annuler</${Btn}>`
        : html`<button type="button" className="linkbtn" onClick=${() => setConfirmDel(true)}>Supprimer cette séance</button>`}</div>` : null}
    </section>
  </div>`;
}

/* ---------- Bilans hebdomadaires ---------- */
function Bilans({ data, plan, prog, stats, src, lib, settings, ai, openChat }) {
  const ps = stats.ps;
  const maxW = ps.phase === "en_cours" ? ps.week : ps.phase === "fini" ? plan.weeks : 0;
  const firstMissing = (() => { for (let w = 1; w <= maxW; w++) if (!data.checkins["w" + w]) return w; return maxW; })();
  const [w, setW] = useState(firstMissing || 1);
  const list = Object.values(data.checkins || {}).filter(Boolean).sort((a, b) => b.w - a.w);
  const [rev, setRev] = useState(null);
  const [sent, setSent] = useState(null);
  const ctl = useRef(null);
  useEffect(() => () => { try { ctl.current && ctl.current.abort(); } catch (e) {} }, []);
  const review = async (wk) => {
    if (!ai || !ai.sample) return;
    const c = new AbortController(); ctl.current = c;
    setRev({ w: wk, text: "", ev: [], busy: true, err: "" });
    try {
      const r = await weeklyReview({ ai, src, plan, prog, lib, settings, w: wk, signal: c.signal, onText: ({ text }) => setRev((x) => ({ ...x, text })), onEvent: (ev) => setRev((x) => ({ ...x, ev })) });
      setRev((x) => ({ ...x, text: r.text, ev: r.events, busy: false }));
    } catch (e) { setRev((x) => ({ ...x, busy: false, err: aiErr(e), text: (e && e.text) || x.text })); }
  };
  const lastRev = chatMsgs(data).filter((m) => m.kind === "bilan" && m.w === w).slice(-1)[0];

        ${rev.ev && rev.ev.length ? html`<div className="evs">${rev.ev.map((x, k) => html`<span key=${k} className="ev">✓ ${x}</span>`)}</div>` : null}
        ${rev.err ? html`<p className="small warn-t">${rev.err}</p>` : null}

      : lastRev ? html`<div className="coachmsg ai"><span className="ai-dot">✦</span><div className="stack-s"><div className="eyebrow">Analyse du coach IA · semaine ${w}</div>

      : ai && data.checkins["w" + w] ? html`<div className="right"><${Btn} small kind="ghost" onClick=${() => review(w)}>Faire analyser ma semaine par le coach IA</${Btn}></div>` : null}

      <div className="chips">${num(c.poids) !== null ? html`<${Pill}>${fmtN(num(c.poids))} kg</${Pill}>` : null}${c.sommeil ? html`<${Pill}>Sommeil ${c.sommeil}/5</${Pill}>` : null}${c.energie ? html`<${Pill}>Énergie ${c.energie}/5</${Pill}>` : null}${c.douleur ? html`<${Pill} tone=${c.douleur >= 4 ? "bad" : "warn"}>Douleur ${c.douleur}/10</${Pill}>` : null}</div>

function CheckinForm({ w, prog, existing, reply, src, onSaved }) {
  const toast = useToast();
  const fields = CHECKIN.filter((f) => !(f.k === "pas" && !(prog.habits || []).length) && !(f.k === "nutrition" && !(prog.habits || []).length));
  const [v, setV] = useState(() => ({ ...(existing || {}) }));
  const [busy, setBusy] = useState(false);
  const set = (k, x) => setV((o) => ({ ...o, [k]: x }));
  const save = async () => {
    setBusy(true);
    const out = { ...v, w, at: (existing && existing.at) || nowISO(), editedAt: existing ? nowISO() : undefined };
    ["poids", "taille", "pas"].forEach((k) => { if (out[k] !== undefined) out[k] = num(out[k]); });
    Object.keys(out).forEach((k) => out[k] === undefined && delete out[k]);
    let ok = false;
    try { await src.saveCheckin(w, out); ok = true; toast("Bilan envoyé.", "ok"); } catch (e) { toast("Envoi impossible. Réessaie dans un instant.", "bad"); } finally { setBusy(false); }
    if (ok && onSaved && !existing) onSaved(w);
  };
  return html`<${Card} title=${"Semaine " + w} sub=${existing ? "Envoyé le " + fmtD(existing.at) + " · tu peux le modifier" : "Réponds à ce qui te concerne"}>
    ${reply ? html`<div className="reply"><b>Réponse de ton coach :</b> ${reply.text}</div>` : null}
    <div className="form">${fields.map((f) => {
      if (f.k === "zone" && !(v.douleur > 0)) return null;
      if (f.type === "scale") return html`<${Field} key=${f.k} label=${f.n}><${Scale} id=${"ck-" + f.k} min=${f.min} max=${f.max} value=${v[f.k] ?? null} onChange=${(x) => set(f.k, x)} lo=${f.lo} hi=${f.hi} /></${Field}>`;
      if (f.type === "num") return html`<${Field} key=${f.k} label=${f.n + (f.u ? " (" + f.u + ")" : "")} id=${"ck-" + f.k}><input id=${"ck-" + f.k} inputMode="decimal" value=${v[f.k] ?? ""} onChange=${(e) => set(f.k, e.target.value)} /></${Field}>`;
      return html`<${Field} key=${f.k} label=${f.n} id=${"ck-" + f.k}><textarea id=${"ck-" + f.k} rows="2" value=${v[f.k] ?? ""} onChange=${(e) => set(f.k, e.target.value)}></textarea></${Field}>`;
    })}</div>
    <div className="actions"><${Btn} block onClick=${save} disabled=${busy}>${existing ? "Mettre à jour mon bilan" : "Envoyer mon bilan"}</${Btn}></div>
  </${Card}>`;
}

/* ---------- Tests ---------- */
function testPoints(plan) { const pts = [0]; for (let w = 4; w <= (plan ? plan.weeks : 12); w += 4) pts.push(w); return pts; }
function TestsForm({ prog, plan, data, src, point, onDone }) {
  const toast = useToast();
  const pts = testPoints(plan);
  const [p, setP] = useState(pts.includes(point) ? point : 0);
  const existing = data.tests["t" + p];
  const [vals, setVals] = useState(() => clone(existing ? existing.values : {}) || {});
  useEffect(() => { const ex = data.tests["t" + p]; setVals(clone(ex ? ex.values : {}) || {}); }, [p]);
  const side = data.profile && data.profile.side;
  const set = (k, x) => setVals((o) => ({ ...o, [k]: x }));
  const save = async () => {
    const out = {};
    prog.tests.forEach((tid) => {
      const t = TESTS[tid]; const v = vals[tid];
      if (v === undefined || v === null || v === "") return;
      if (t.type === "pair") { const g = num(v.g), d = num(v.d); if (g !== null || d !== null) out[tid] = { g, d }; }
      else if (t.type === "e1rm") { const kg = num(v.kg), reps = num(v.reps); const e = epley(kg, reps); if (e) out[tid] = { kg, reps, v: e }; }
      else { const n = num(v); if (n !== null) out[tid] = n; }
    });
    try { await src.saveTest("t" + p, { w: p, at: nowISO(), values: out }); toast("Tests enregistrés.", "ok"); onDone && onDone(); } catch (e) { toast("Enregistrement impossible.", "bad"); }
  };
  return html`<div className="form">
    <${Seg} options=${pts.map((x) => ({ v: x, n: x === 0 ? "Départ" : "S" + x }))} value=${p} onChange=${setP} />
    ${prog.tests.map((tid) => {
      const t = TESTS[tid]; const v = vals[tid];
      if (!t) return null;
      if (t.type === "pair") return html`<${Field} key=${tid} label=${t.n + " (" + t.u + ")"} hint=${t.help}><div className="row2">
        <input id=${"t-" + tid + "-g"} inputMode="decimal" placeholder="Gauche" aria-label="Gauche" value=${(v && v.g) ?? ""} onChange=${(e) => set(tid, { ...(v || {}), g: e.target.value })} />
        <input id=${"t-" + tid + "-d"} inputMode="decimal" placeholder="Droite" aria-label="Droite" value=${(v && v.d) ?? ""} onChange=${(e) => set(tid, { ...(v || {}), d: e.target.value })} /></div>
        ${v && lsi({ g: num(v.g), d: num(v.d) }, side) ? html`<span className="small">Indice de symétrie : <b>${lsi({ g: num(v.g), d: num(v.d) }, side)} %</b> (objectif ≥ 90 %)</span>` : null}</${Field}>`;
      if (t.type === "e1rm") return html`<${Field} key=${tid} label=${t.n} hint=${t.help}><div className="row2">
        <input id=${"t-" + tid + "-kg"} inputMode="decimal" placeholder="Charge (kg)" aria-label="Charge" value=${(v && v.kg) ?? ""} onChange=${(e) => set(tid, { ...(v || {}), kg: e.target.value })} />
        <input id=${"t-" + tid + "-r"} inputMode="numeric" placeholder="Répétitions" aria-label="Répétitions" value=${(v && v.reps) ?? ""} onChange=${(e) => set(tid, { ...(v || {}), reps: e.target.value })} /></div>
        ${v && epley(num(v.kg), num(v.reps)) ? html`<span className="small">Maximum estimé : <b>${fmtN(epley(num(v.kg), num(v.reps)))} kg</b></span>` : null}</${Field}>`;
      return html`<${Field} key=${tid} label=${t.n + " (" + t.u + ")"} hint=${t.help} id=${"t-" + tid}><input id=${"t-" + tid} inputMode="decimal" value=${v ?? ""} onChange=${(e) => set(tid, e.target.value)} />
        ${tid === "vma" && num(v) ? html`<span className="small">VMA estimée : <b>${fmtN(num(v) / 100)} km/h</b></span>` : null}</${Field}>`;
    })}
    <div className="actions"><${Btn} block onClick=${save}>Enregistrer les tests</${Btn}></div>
  </div>`;
}
function TestsTable({ prog, plan, data }) {
  const pts = testPoints(plan).filter((p) => data.tests["t" + p]);
  const side = data.profile && data.profile.side;
  if (!pts.length) return html`<p className="muted small">Aucun test enregistré pour l'instant.</p>`;
  return html`<div className="tscroll"><table className="ttable">
    <thead><tr><th>Test</th>${pts.map((p) => html`<th key=${p}>${p === 0 ? "Départ" : "S" + p}</th>`)}<th>Évolution</th></tr></thead>
    <tbody>${prog.tests.map((tid) => {
      const t = TESTS[tid]; if (!t) return null;
      const vals = pts.map((p) => testValue(tid, data.tests["t" + p].values[tid], side));
      const better = testBetter(prog, tid);
      const cell = (v) => v === null ? "—" : t.type === "pair" ? (fmtN(v.g) + " / " + fmtN(v.d) + (lsi(v, side) ? " · " + lsi(v, side) + " %" : "")) : fmtN(v, 2);
      const firstI = vals.findIndex((v) => v !== null);
      let lastI = -1; vals.forEach((v, i) => { if (v !== null) lastI = i; });
      let evo = null;
      if (firstI >= 0 && lastI > firstI) {
        if (t.type === "pair") { const a = lsi(vals[firstI], side), b = lsi(vals[lastI], side); evo = a && b ? html`<${Delta} a=${a} b=${b} better="high" unit="%" digits=${0} />` : null; }
        else evo = html`<${Delta} a=${vals[firstI]} b=${vals[lastI]} better=${better} unit=${t.u} />`;
      }
      return html`<tr key=${tid}><th>${t.n}<small>${t.u}</small></th>${vals.map((v, i) => html`<td key=${i}>${cell(v)}</td>`)}<td>${evo || "—"}</td></tr>`;
    })}</tbody></table></div>`;
}

/* ---------- Progrès ---------- */
function Progress({ data, plan, prog, stats, openTests }) {
  const ps = stats.ps;
  const weeksUpTo = ps.phase === "fini" ? plan.weeks : Math.max(1, ps.week);
  const adh = Array.from({ length: weeksUpTo }, (_, i) => { const w = i + 1; return { x: "S" + w, y: stats.doneByWeek[w] || 0, note: "prévu " + (stats.plannedByWeek[w] || 0), muted: w === ps.week && ps.phase === "en_cours" }; });
  const load = Array.from({ length: weeksUpTo }, (_, i) => { const w = i + 1; return { x: "S" + w, y: stats.loadByWeek[w] || 0, muted: w === ps.week && ps.phase === "en_cours" }; });
  const tp = testPoints(plan);
  const nextPoint = tp.find((p) => !data.tests["t" + p]);
  return html`<div className="stack">
    <div className="hero"><div className="eyebrow">Mes progrès</div><h1>${stats.logs.filter((l) => l.kind !== "presentiel").length} séances · ${stats.adherence === null ? "régularité calculée dès la semaine 2" : Math.round(stats.adherence * 100) + " % de régularité"}</h1></div>
    <${Card} title="Mes tests" sub="Départ puis toutes les 4 semaines" action=${html`<${Btn} small kind="ghost" onClick=${() => openTests(nextPoint ?? 0)}>Saisir</${Btn}>`}>
      <${TestsTable} prog=${prog} plan=${plan} data=${data} /></${Card}>
    ${stats.weights.length ? html`<${Card} title="Poids"><${LineChart} points=${stats.weights} unit="kg" /></${Card}>` : null}
    ${stats.waists.length ? html`<${Card} title="Tour de taille"><${LineChart} points=${stats.waists} unit="cm" /></${Card}>` : null}
    <${Card} title="Séances par semaine" sub="La semaine en cours est en clair"><${BarChart} data=${adh} unit="séances" /></${Card}>
    <${Card} title="Charge d'entraînement" sub="Effort ressenti × durée, par semaine"><${BarChart} data=${load} unit="UA" /></${Card}>
    ${stats.liftSeries.map((s) => html`<${Card} key=${s.e} title=${(EXB[s.e] ? EXB[s.e].n : s.e) + " — maximum estimé"}><${LineChart} points=${s.points} unit="kg" /></${Card}>`)}
  </div>`;
}
